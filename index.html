  function vSummary(acts) {
    if (!P.estimates.length) return `<header class="ph"><h1>Сводная</h1></header><div class="dropzone" data-drop="estimate"><p>Сводная таблица появится после загрузки сметы — перетащите её сюда.</p><button class="btn primary" data-act="load-estimate">Выбрать файл…</button></div>`;
    // объёмы по позициям: { act index, объём, стадия }
    const byPos = new Map();
    acts.forEach((a, i) => (a.items || []).forEach(it => { const v = +it.vol || 0; if (!byPos.has(it.posKey)) byPos.set(it.posKey, []); byPos.get(it.posKey).push({ i, vol: v, st: stOf(a.src).k }); }));
    const allWorks = P.estimates.flatMap(e => e.positions.filter(isWork));
    const tot = closure(allWorks, byPos);
    const stCount = STATUSES.map(x => ({ ...x, n: acts.filter(a => stOf(a.src).k === x.k).length }));
    const signedN = stCount.find(x => x.k === 'done').n;
    const noAct = allWorks.filter(p => !(byPos.get(p.key) || []).length).length;
    const filt = x => sumFilter === 'all' || (sumFilter === 'none' ? x === null : x === sumFilter);
    let rowNo = 0;
    const estBlocks = P.estimates.map(e => {
      const ws = e.positions.filter(isWork); if (!ws.length) return '';
      const c = closure(ws, byPos); const k = 'sum:' + e.id; const open = isOpen(k);
      const body = !open ? '' : e.sections.map(sec => {
        const sw = ws.filter(p => p.section === sec); if (!sw.length) return '';
        const sc = closure(sw, byPos);
        const rows = sw.map(p => {
          const list = byPos.get(p.key) || []; let cum = 0;
          if (!list.length) {
            if (!filt(null)) return '';
            return `<tr class="noact"><td class="c nw">${++rowNo}</td><td class="nw muted">—</td><td>${esc(p.name)}<div class="muted sm">поз. ${p.n} · ещё нет акта</div></td>
              <td class="r nw">${fmtNum(p.baseQty)} ${esc(p.baseUnit)}</td><td class="r nw">0</td><td class="r nw">${fmtNum(p.baseQty)}</td>
              <td><button class="btn sm" data-act="act-from" data-k="${esc(p.key)}">+ Акт</button></td>
              <td><textarea class="note" rows="1" data-path="posNotes.${esc(p.key)}" placeholder="почему не делается…">${esc((P.posNotes || {})[p.key] || '')}</textarea></td></tr>`;
          }
          return list.map(x => {
            cum += x.vol; const a = acts[x.i]; const rest = p.baseQty - cum;
            if (!filt(x.st)) return '';
            return `<tr class="st-row-${x.st}"><td class="c nw">${++rowNo}</td><td class="nw"><button class="lnk" data-act="goto-act" data-i="${x.i}">${esc(a.num)}</button><div class="muted sm">${fmtDate(a.src.date)}</div></td>
              <td>${esc(a.baseTitle)}<div class="muted sm">поз. ${p.n}${a.baseTitle !== p.name ? ' · ' + esc(p.name.slice(0, 80)) : ''}</div></td>
              <td class="r nw">${fmtNum(p.baseQty)} ${esc(p.baseUnit)}</td><td class="r nw">${fmtNum(x.vol)}</td>
              <td class="r nw ${rest < -1e-6 ? 'neg' : rest < 1e-6 ? 'done' : ''}">${fmtNum(Math.abs(rest) < 1e-6 ? 0 : rest)}</td>
              <td>${statusSelect(x.i, a.src)}</td>
              <td><textarea class="note" rows="1" data-path="acts.${x.i}.note" placeholder="${['rej', 'fix', 'check'].includes(x.st) ? 'причина…' : ''}">${esc(a.src.note || '')}</textarea></td></tr>`;
          }).join('');
        }).join('');
        if (!rows) return '';
        return `${sec ? `<tr class="sec"><td colspan="8"><div class="sec-h"><span>${esc(sec)}</span>${pbar(sc)}<span class="muted">${pct(sc.signed)} подписано · ${pct(sc.acts)} в актах</span></div></td></tr>` : ''}${rows}`;
      }).join('');
      return `<section class="card flush fold ${open ? '' : 'closed'}">
        <div class="card-h tg" data-tg="${esc(k)}">${chev(k)}<h2>${esc(e.id)}</h2>${pbar(c)}<span class="stat">подписано ${pct(c.signed)} · в актах ${pct(c.acts)} · закрыто работ ${c.full} из ${c.count}</span></div>
        ${open ? (body ? `<table class="tbl sum"><thead><tr><th class="c">№ п/п</th><th>№ акта</th><th>Наименование акта</th><th class="r">Объём всего</th><th class="r">Закрыто</th><th class="r">Осталось закрыть</th><th>Стадия ИД</th><th>Примечание</th></tr></thead><tbody>${body}</tbody></table>` : '<p class="muted pad">Нет строк по выбранному фильтру.</p>') : ''}
      </section>`;
    }).join('');
    const chips = [{ k: 'all', t: 'Все', n: acts.length + noAct }, ...stCount, { k: 'none', t: 'Без акта', n: noAct }];
    return `<header class="ph"><h1>Сводная по исполнительной документации</h1><p>Строится автоматически по загруженным сметам и актам. Стадию ИД меняйте прямо в таблице. «Осталось закрыть» — остаток по позиции после этого акта.</p></header>
      <section class="card dash">
        <div class="dash-donut">${donut(stCount, acts.length, `${signedN} из ${acts.length}`, 'актов подписано')}
          <ul class="legend">${stCount.map(x => `<li><i class="lg-${x.k}"></i>${x.t}<b>${x.n}</b></li>`).join('')}</ul></div>
        <div class="dash-kpi">
          <div class="kpi"><span>Объём подписан</span><b>${pct(tot.signed)}</b><small>по позициям смет</small></div>
          <div class="kpi"><span>Оформлено актами</span><b>${pct(tot.acts)}</b><small>включая неподписанные</small></div>
          <div class="kpi"><span>Работ закрыто полностью</span><b>${tot.full} <em>из ${tot.count}</em></b><small>подписано полностью: ${tot.fullSigned}</small></div>
          <div class="kpi"><span>Работ без акта</span><b>${noAct}</b><small>${noAct ? 'ещё не оформлены' : 'все работы в актах'}</small></div>
        </div>
        <div class="dash-bars">
          <div class="pb-legend"><span><i class="pb-done"></i>подписано</span><span><i class="pb-acts"></i>в актах, не подписано</span><span><i class="pb-rest"></i>не закрыто</span></div>
          ${P.estimates.map(e => { const ws = e.positions.filter(isWork); if (!ws.length) return ''; const c = closure(ws, byPos);
            return `<div class="eb"><div class="eb-n" title="${esc(e.id)}">${esc(e.id)}</div>${pbar(c)}<div class="eb-v">${pct(c.signed)} / ${pct(c.acts)}</div></div>`; }).join('')}
        </div>
      </section>
      <div class="row gap"><button class="btn" data-act="sum-xlsx">Выгрузить в Excel</button><button class="btn" data-act="sum-print">Печать</button>
        <span class="muted">На печать — общий прогресс и акты «Не подписано» и «На исправлении» с примечаниями.</span></div>
      <div class="row gap fchips">${chips.map(x => `<button class="fchip ${sumFilter === x.k ? 'on' : ''}" data-act="sum-filter" data-k="${x.k}">${x.k !== 'all' && x.k !== 'none' ? `<i class="lg-${x.k}"></i>` : ''}${x.t}<b>${x.n}</b></button>`).join('')}
        <span class="sp"></span><button class="btn ghost sm" data-act="fold-all" data-scope="sum" data-v="0">Свернуть все</button><button class="btn ghost sm" data-act="fold-all" data-scope="sum" data-v="1">Развернуть все</button></div>
      ${estBlocks}`;
  }

  let justAdded = null; // позиция, по которой только что создан акт (подсветка)
  function vEstimate(acts) {
    const { used } = computed();
    const byPos = new Map(); (acts || []).forEach((a, i) => (a.items || []).forEach(it => { if (!byPos.has(it.posKey)) byPos.set(it.posKey, []); if (!byPos.get(it.posKey).includes(i)) byPos.get(it.posKey).push(i); }));
    if (!P.estimates.length) return `<header class="ph"><h1>Смета</h1></header><div class="dropzone" data-drop="estimate"><p>Перетащите сюда локальный сметный расчёт — выгрузку из ГРАНД-Сметы в Excel (форма по 421/пр).<br>Можно несколько файлов сразу.</p><button class="btn primary" data-act="load-estimate">Выбрать файл…</button></div>`;
    return `<header class="ph"><h1>Смета</h1><p>Объёмы приведены к физическим единицам (10 м3 → м3, км → м). Кнопка «+ Акт» добавляет акт на остаток объёма позиции — он появится в строке, а сама вкладка «Акты» не откроется. Щелчок по заголовку сметы или раздела сворачивает его.</p></header>
      <div class="row gap"><button class="btn" data-act="load-estimate">Добавить / обновить смету…</button><span class="muted">или перетащите файл сметы в окно</span><span class="sp"></span>
        <button class="btn ghost sm" data-act="fold-all" data-scope="est" data-v="0">Свернуть все</button><button class="btn ghost sm" data-act="fold-all" data-scope="est" data-v="1">Развернуть все</button></div>
      ${P.estimates.map((e, ei) => {
        const k = 'est:' + e.id, open = isOpen(k);
        const ws = e.positions.filter(isWork);
        const excl = e.positions.filter(p => p.excluded).length; const showEx = !!((P.ui || {}).showExcl || {})[e.id];
        const done = ws.filter(p => (used.get(p.key) || 0) >= p.baseQty - 1e-6).length;
        const inActs = ws.filter(p => used.get(p.key)).length;
        return `<section class="card flush fold ${open ? '' : 'closed'}">
        <div class="card-h tg" data-tg="${esc(k)}">${chev(k)}<h2>${esc(e.id)}</h2><small>${esc(e.object || '')}${e.basis ? ' · основание ' + esc(e.basis) : ''}</small>
          <span class="stat">работ ${ws.length} · в актах ${inActs} · закрыто ${done}</span>
          ${excl ? `<button class="btn ghost sm" data-act="show-excl" data-id="${esc(e.id)}">${showEx ? 'Скрыть' : 'Показать'} исключённые (${excl})</button>` : ''}
          <button class="btn ghost sm" data-act="del-est" data-i="${ei}">Убрать смету</button></div>
        ${open ? `<table class="tbl"><thead><tr><th>№</th><th>Обоснование</th><th>Наименование</th><th class="r">По смете</th><th class="r">В актах</th><th class="r">Остаток</th><th></th></tr></thead><tbody>
        ${e.sections.map(sec => { const sk = 'sec:' + e.id + '|' + sec, so = isOpen(sk); const sp = e.positions.filter(p => p.section === sec && (showEx || !p.excluded));
          return `<tr class="sec tg" data-tg="${esc(sk)}"><td colspan="7">${chev(sk)}${esc(sec)} <span class="muted">· ${sp.length} поз.</span></td></tr>` + (so ? sp.map(p => {
          const u = used.get(p.key) || 0, rest = p.baseQty - u;
          const pa = byPos.get(p.key) || [];
          const chips = pa.length ? `<div class="achips">${pa.map(i => `<span class="achip" title="${esc(acts[i].baseTitle)}"><button class="achip-n" data-act="goto-act" data-i="${i}" title="Открыть акт">Акт ${esc(acts[i].num)}</button><button class="achip-x" data-act="del-act-i" data-i="${i}" title="Удалить акт ${esc(acts[i].num)}">✕</button></span>`).join('')}</div>` : '';
          if (p.excluded) return `<tr class="excluded"><td>${p.n}</td><td class="code">${esc(p.code)}</td><td>${esc(p.name)}<span class="tag">исключена из ИД</span></td><td class="r nw">${fmtNum(p.baseQty)} ${esc(p.baseUnit)}</td><td></td><td></td><td><button class="btn ghost sm" data-act="incl-pos" data-k="${esc(p.key)}">Вернуть</button></td></tr>`;
          return `<tr class="${p.kind}${pa.length ? ' in-act' : ''}${justAdded === p.key ? ' just' : ''}"><td>${p.n}</td><td class="code">${esc(p.code)}</td><td>${esc(p.name)}${p.kind !== 'work' ? `<span class="tag">${p.kind === 'equipment' ? 'оборудование' : 'материал'}</span>` : ''}${e.format === 'calc' && p.resources.length ? `<div class="res">${p.resources.map(r => `${esc(r.name)} — ${fmtNum(r.qty)} ${esc(r.unit)}`).join('; ')}</div>` : ''}${chips}</td>
            <td class="r nw">${fmtNum(p.baseQty)} ${esc(p.baseUnit)}</td><td class="r nw">${p.kind === 'work' && u ? fmtNum(u) : ''}</td>
            <td class="r nw ${rest < -1e-6 ? 'neg' : rest < 1e-6 && u ? 'done' : ''}">${p.kind === 'work' ? fmtNum(rest) : ''}</td>
            <td class="nw">${p.kind === 'work' ? `<button class="btn sm" data-act="act-from" data-k="${esc(p.key)}">+ Акт</button><button class="btn ghost sm excl-b" data-act="excl-pos" data-k="${esc(p.key)}" title="Исключить работу из исполнительной (можно вернуть)">✕</button>` : ''}</td></tr>`;
        }).join('') : ''); }).join('')}
        </tbody></table>` : ''}</section>`; }).join('')}`;
  }

  const isOpen = k => !((P.ui || {}).collapsed || {})[k];
  const chev = k => `<span class="chev ${isOpen(k) ? 'open' : ''}" aria-hidden="true"></span>`;
  function toggle(k, val) { P.ui = P.ui || {}; P.ui.collapsed = P.ui.collapsed || {}; P.ui.collapsed[k] = val === undefined ? !P.ui.collapsed[k] : !val; save(); }
  const estOfMat = (m, e) => (m.positions || []).some(k => k.startsWith(e.id + '#')) || m.est === e.id;

  /* — материалы — */
  function vMaterials() {
    if (!P.materials.length) return `<header class="ph"><h1>Материалы</h1></header><p class="empty">Материалы появятся после загрузки сметы.</p>`;
    const pi = posIndex();
    const idx = new Map(P.materials.map((m, i) => [m, i]));
    const row = (m, e) => {
      const i = idx.get(m); const manual = !(m.positions || []).length;
      const posN = e ? m.positions.filter(k => k.startsWith(e.id + '#')).map(k => (pi.get(k) || {}).n).filter(Boolean) : [];
      const also = e ? P.estimates.filter(x => x !== e && estOfMat(m, x)).map(x => x.id) : [];
      return `<tr class="${m.skip ? 'skip' : ''}"><td>${manual ? `<input data-path="materials.${i}.name" value="${esc(m.name)}" placeholder="Наименование материала">` : `<div class="mname">${esc(m.name)}</div>`}
        <small class="code">${manual ? 'добавлен вручную' : `${[m.code, m.unit].filter(Boolean).map(esc).join(' · ')}${posN.length ? ' · поз. ' + posN.slice(0, 6).join(', ') + (posN.length > 6 ? ` и ещё ${posN.length - 6}` : '') : ''}`}${also.length ? ` · также в ${also.map(esc).join(', ')}` : ''}</small></td>
        <td class="c skipc"><input type="checkbox" data-path="materials.${i}.skip" ${m.skip ? 'checked' : ''} title="Не включать в акты"></td>
        <td><input data-path="materials.${i}.short" value="${esc(m.short)}" placeholder="как в смете"></td>
        <td><input data-path="materials.${i}.doc" value="${esc(m.doc)}" placeholder="Паспорт качества № … от …" class="${!m.doc && !m.skip ? 'need' : ''}"></td>
        <td class="c"><input class="pg" type="number" step="1" min="1" data-path="materials.${i}.pages" value="${esc(m.pages || '')}" placeholder="1"></td>
        <td class="c">${manual ? `<button class="btn ghost sm" data-act="del-mat" data-i="${i}" title="Удалить">✕</button>` : ''}</td></tr>`;
    };
    const minPos = (m, e) => Math.min(...m.positions.filter(k => k.startsWith(e.id + '#')).map(k => { const p = pi.get(k); return p ? (p.ord != null ? p.ord : +p.n) : 1e9; }), 1e9);
    const thead = `<thead><tr><th>Материал по смете</th><th class="c" title="Не включать в акты">Искл.</th><th>Наименование для актов</th><th>Документ о качестве</th><th class="c" title="Листов в реестре">Листов</th><th></th></tr></thead>`;
    const group = (k, title, sub, list, e) => {
      const open = isOpen(k); const act = list.filter(m => !m.skip);
      const nodoc = act.filter(m => !m.doc).length;
      return `<section class="card flush fold ${open ? '' : 'closed'}">
        <div class="card-h tg" data-tg="${esc(k)}">${chev(k)}<h2>${esc(title)}</h2><small>${esc(sub || '')}</small>
          <span class="stat">${list.length} мат.${nodoc ? ` · <b class="warn-t">без документа ${nodoc}</b>` : act.length ? ' · <b class="ok-t">все с документами</b>' : ''}</span>
          ${e ? `<button class="btn ghost sm" data-act="add-mat" data-est="${esc(e.id)}">+ Материал</button>` : ''}</div>
        ${open ? (list.length ? `<table class="tbl mats">${thead}<tbody>${list.map(m => row(m, e)).join('')}</tbody></table>` : '<p class="muted pad">Материалов нет.</p>') : ''}</section>`;
    };
    const orphan = P.materials.filter(m => !P.estimates.some(e => estOfMat(m, e)));
    const allAct = P.materials.filter(m => !m.skip);
    return `<header class="ph"><h1>Материалы и документы о качестве</h1><p>Материалы сгруппированы по сметам. Документ заполняется один раз — он попадёт во все акты с этим материалом и в реестр. Если материал есть в нескольких сметах, правка в одной видна во всех.</p></header>

        <button class="btn ghost sm" data-act="fold-all" data-scope="mat" data-v="0">Свернуть все</button><button class="btn ghost sm" data-act="fold-all" data-scope="mat" data-v="1">Развернуть все</button></div>
      ${P.estimates.map(e => group('mat:' + e.id, e.id, e.object, P.materials.filter(m => estOfMat(m, e)).sort((a, b) => (+!!b.est - +!!a.est) || minPos(a, e) - minPos(b, e)), e)).join('')}
      ${orphan.length ? group('mat:__none', 'Без сметы', 'добавлены вручную до привязки к сметам', orphan, null) : ''}`;
  }

  /* — акты — */
  function vActs(acts) {
    if (!P.acts.length) return `<header class="ph"><h1>Акты</h1></header><div class="dropzone"><p>Создайте акт из позиции сметы (вкладка «Смета» → «+ Акт») или пустой.</p><button class="btn primary" data-act="add-act">+ Пустой акт</button></div>`;
    curAct = Math.min(curAct, P.acts.length - 1);
    const a = P.acts[curAct], c = acts[curAct];
    return `<div class="acts">
      <aside class="alist">
        <div class="row gap"><button class="btn sm primary" data-act="add-act">+ Акт</button><button class="btn sm" data-act="gen-one" title="Только выбранный акт">Сформировать выбранный</button></div>
        <ol>${acts.map((x, i) => `<li class="${i === curAct ? 'on' : ''}" data-sel="${i}"><div class="ah"><i class="sdot lg-${stOf(x.src).k}" title="${stOf(x.src).t}"></i><b>${esc(x.num)}</b><span>${fmtDate(x.src.date)}</span>${x.warnings.length ? `<i class="w" title="${esc(x.warnings.join('\n'))}">${x.warnings.length}</i>` : ''}</div><div class="at">${esc(x.baseTitle || '(без названия)')}</div><div class="as">${esc((x.signers[1] || {}).fio || '—')} · ${esc((x.signers[2] || {}).fio || '—')}</div></li>`).join('')}</ol>
      </aside>
      <div class="aedit">${vActEditor(a, c)}</div></div>`;
  }
  function vActEditor(a, c) {
    const i = curAct, pp = `acts.${i}.`, pi = posIndex(); const { used } = computed();
    const ws = works();
    const itemRows = (a.items || []).map((it, k) => {
      const p = pi.get(it.posKey); const rest = p ? p.baseQty - (used.get(it.posKey) || 0) : 0;
      const est = P.estimates.find(e => p ? e.id === p.ls : false) || P.estimates[0];
      const opts = est ? est.sections.map(sec => {
        const list = est.positions.filter(w => isWork(w) && w.section === sec);
        if (!list.length) return '';
        const o = list.map(w => `<option value="${esc(w.key)}" ${w.key === it.posKey ? 'selected' : ''}>${w.n}. ${esc(w.name.slice(0, 110))}</option>`).join('');
        return sec ? `<optgroup label="${esc(sec)}">${o}</optgroup>` : o;
      }).join('') : '';
      return `<div class="item">
        <div class="pick"><select class="est-sel" data-item-est="${k}" title="Смета">${P.estimates.map(e => `<option value="${esc(e.id)}" ${est && e.id === est.id ? 'selected' : ''}>${esc(e.id)}</option>`).join('')}</select>
        <select data-path="${pp}items.${k}.posKey" title="Работа">${opts}</select></div>
        <label class="vol"><input type="number" step="any" data-path="${pp}items.${k}.vol" value="${esc(it.vol)}"><span>${esc(p ? p.baseUnit : '')}</span></label>
        <small class="${rest < -1e-6 ? 'neg' : ''}">остаток ${p ? fmtNum(rest) : '—'} из ${p ? fmtNum(p.baseQty) : '—'}</small>
        <button class="btn ghost sm" data-act="del-item" data-k="${k}" title="Убрать позицию">✕</button></div>`;
    }).join('');
    const rel = new Set(matsForPositions((a.items || []).map(x => x.posKey), false));
    const sel = new Set(a.materials || []);
    const matList = P.materials.filter(m => showAllMats || rel.has(m.key) || sel.has(m.key));
    return `
      <header class="ae-h"><div><h1>Акт ${esc(c.num)} ${statusSelect(curAct, a)}</h1><p>${esc(c.title || '')}</p></div>
        <div class="row"><button class="btn ghost sm" data-act="mv" data-d="-1" title="Выше">↑</button><button class="btn ghost sm" data-act="mv" data-d="1" title="Ниже">↓</button><button class="btn ghost sm" data-act="dup-act">Дублировать</button><button class="btn ghost sm danger" data-act="del-act">Удалить</button></div></header>
      ${c.warnings.length ? `<div class="warns">${c.warnings.map(w => `<div>⚠ ${esc(w)}</div>`).join('')}</div>` : ''}
      <section class="card">
        <div class="grid4">
          ${field('№ акта', pp + 'num', { ph: c.num, hint: 'пусто = авто' })}
          ${field('Дата акта', pp + 'date', { type: 'date', hint: 'по ней выбираются подписанты' })}
          ${field('Начало работ', pp + 'start', { type: 'date' })}
          ${field('Окончание работ', pp + 'end', { type: 'date' })}
        </div>
      </section>
      <section class="card">
        <h2>Подписанты на ${fmtDate(a.date) || '—'}</h2>
        <div class="signers">${ROLES.map(r => { const o = c.signers[r.id]; return `<div class="sg ${o ? '' : r.required ? 'miss' : 'none'}"><span>${r.short}</span><b>${o ? esc(o.fio) : r.required ? 'нет приказа' : '—'}</b>${o ? `<small>${esc(o.docType || 'приказ')} №${esc(o.number)} от ${fmtDate(o.date)}</small>` : ''}</div>`; }).join('')}</div>
      </section>
      <section class="card">
        <h2>1. Работы и объёмы из сметы</h2>
        ${itemRows || '<p class="muted">Позиции сметы не выбраны.</p>'}
        <div class="row gap"><button class="btn sm" data-act="add-item" ${ws.length ? '' : 'disabled'}>+ Позиция сметы</button><label class="chk sm"><input type="checkbox" data-path="${pp}volInTitle" ${a.volInTitle !== false ? 'checked' : ''}> добавлять объём в наименование</label></div>
        ${field('Наименование скрытых работ', pp + 'title', { area: true, ph: c.baseTitle, hint: 'пусто = как в смете' })}
      </section>
      <section class="card">
        <div class="card-h2"><h2>3. Материалы</h2><label class="chk sm"><input type="checkbox" data-act="all-mats" ${showAllMats ? 'checked' : ''}> показать все материалы сметы</label></div>
        <div class="mlist">${matList.map(m => `<label class="mi ${m.doc ? '' : 'nodoc'}"><input type="checkbox" data-mat="${esc(m.key)}" ${sel.has(m.key) ? 'checked' : ''}><span>${esc(m.short || m.name)}</span><small>${m.doc ? esc(m.doc) : 'нет документа о качестве'}</small></label>`).join('') || '<p class="muted">Нет материалов по выбранным позициям.</p>'}</div>
        ${field('Если материалов нет, писать', pp + 'matsNone', { ph: 'н/п' })}
      </section>
      <section class="card">
        <h2>Документы и связи</h2>
        <div class="grid2">
          ${field('Исполнительная схема', pp + 'scheme', { area: true, ph: c.scheme, hint: 'пусто = авто' })}
          <div class="grid2 inner">${field('Листов в схеме', pp + 'schemePages', { type: 'number', ph: '1' })}${field('Листов в акте', pp + 'actPages', { type: 'number', ph: '1' })}</div>
          ${field('Другие документы (протоколы, заключения), через «;»', pp + 'docsExtra', { area: true, cls: 'span2' })}
          ${field('7. Разрешается производство последующих работ', pp + 'next', { area: true, ph: c.next || '-', hint: 'пусто = следующий акт' })}
          ${field('2. Проектная документация', pp + 'project', { area: true, ph: c.project, hint: c.projectFrom ? `пусто = как в акте ${esc(c.projectFrom)}` : 'пусто = из реквизитов; вписанное перейдёт в следующие акты' })}
          ${field('6. Работы выполнены в соответствии с', pp + 'norms', { area: true, ph: c.norms, cls: 'span2', hint: c.normsFrom ? `пусто = как в акте ${esc(c.normsFrom)}` : 'пусто = из реквизитов; вписанное перейдёт в следующие акты' })}
        </div>
        <div class="preview"><span>Приложения:</span><pre>${esc(c.apps)}</pre></div>
      </section>`;
  }

  /* — поля шаблона — */
  /* — реестр — */
  function vRegistry(acts) {
    const rows = IDG.registryRows(P, acts);
    const kinds = { reg: 'реестр', extra: 'доп.', order: 'приказ', act: 'АОСР', scheme: 'схема', mat: 'материал', doc: 'документ' };
    const docs = P.registryDocs || [];
    return `<header class="ph"><h1>Реестр исполнительной документации</h1><p>Собирается из актов: копии действующих приказов, затем по каждому акту — АОСР, исполнительная схема и документы о качестве на материалы. Страницы считаются формулами, как в вашем шаблоне, поэтому листы можно поправить прямо в Excel.</p></header>
      <div class="row gap"><button class="btn primary" data-act="gen-reg">Сформировать реестр (.xlsx)</button><span class="muted">Реестр также автоматически прикладывается к комплекту актов — отдельным листом.</span></div>
      <section class="card"><div class="grid2">
        ${field('Номер реестра', 'object.registryNo', { ph: '1-ТКР3-ЭС', hint: 'в заголовок «РЕЕСТР №…» и в первую строку' })}
        ${field('Организация в шапке', 'object.registryOrg', { ph: 'ООО "САНРАЙЗ"' })}
      </div></section>
      <section class="card">
        <div class="card-h2"><h2>Дополнительные документы</h2><button class="btn sm" data-act="add-rdoc">+ Документ</button></div>
        <p class="note" style="margin:0 0 10px">Акты готовности, протоколы испытаний, удостоверения, ведомости — всё, чего нет в актах.</p>
        ${docs.length ? `<table class="tbl rdocs"><thead><tr><th>Наименование документа</th><th>№, дата</th><th class="c">Листов</th><th>Где</th><th></th></tr></thead><tbody>
        ${docs.map((d, i) => `<tr><td><input data-path="registryDocs.${i}.name" value="${esc(d.name)}" placeholder="Протокол. Измерение сопротивления…"></td>
          <td><input data-path="registryDocs.${i}.no" value="${esc(d.no)}" placeholder="б/н"></td>
          <td class="c"><input class="pg" type="number" step="1" min="1" data-path="registryDocs.${i}.pages" value="${esc(d.pages || '')}" placeholder="1"></td>
          <td><select data-path="registryDocs.${i}.where"><option value="end" ${d.where !== 'start' ? 'selected' : ''}>в конце</option><option value="start" ${d.where === 'start' ? 'selected' : ''}>в начале</option></select></td>
          <td><button class="btn ghost sm" data-act="del-rdoc" data-i="${i}" title="Удалить">✕</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Нет.</p>'}
      </section>
      <section class="card flush">
        <div class="card-h"><h2>Предпросмотр</h2><small>${rows.length} строк · ${rows.length ? rows[rows.length - 1].to : 0} листов</small></div>
        <table class="tbl reg"><thead><tr><th class="c">№</th><th>Полное наименование документа</th><th>№ чертежа, акта и др.</th><th class="c">Листов</th><th class="c">Страница</th></tr></thead><tbody>
        ${rows.map((r, i) => `<tr class="k-${r.kind}"><td class="c nw">${i + 1}</td><td>${esc(r.name)}<span class="tag">${kinds[r.kind]}</span></td><td>${esc(r.no) || '<span class="muted">—</span>'}</td><td class="c nw">${r.pages}</td><td class="c nw">${r.from === r.to ? r.from : r.from + ' – ' + r.to}</td></tr>`).join('')}
        </tbody></table>
      </section>`;
  }

  function vMapping() {
    const t = P.template;
    if (!t) return `<header class="ph"><h1>Поля шаблона</h1></header><p class="empty">Загрузите шаблон на вкладке «Объект и шаблон».</p>`;
    const an = t.analysis;
    return `<header class="ph"><h1>Поля шаблона</h1><p>Адреса ячеек, куда программа пишет данные. Найдены автоматически по подписям формы 344/пр; поправьте, если шаблон другой. Пустой адрес — поле не заполняется.</p></header>
      <section class="card"><div class="grid2">
        <label class="fld"><span>Лист с формой АОСР</span><select data-path="template.analysis.actSheet">${an.sheets.map(s => `<option ${s === an.actSheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
        <label class="fld"><span>Лист реестра ИД</span><select data-path="template.analysis.registrySheet"><option value="">— встроенный образец реестра —</option>${an.sheets.map(s => `<option ${s === an.registrySheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></label>
      </div></section>
      <section class="card flush"><table class="tbl map"><thead><tr><th>Поле</th><th>Ячейка</th></tr></thead><tbody>
        ${FIELD_DEFS.map(([k, label]) => `<tr><td>${label}</td><td><input class="addr ${an.map[k] ? '' : 'need'}" data-path="template.analysis.map.${k}" value="${esc(an.map[k] || '')}" placeholder="—"></td></tr>`).join('')}
      </tbody></table></section>`;
  }

  /* ── события ── */
  function onInput(e) {
    const el = e.target; const path = el.dataset.path; if (!path) return;
    if (e.type === 'input' && (el.tagName === 'SELECT' || el.type === 'checkbox')) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.type === 'number') v = el.value === '' ? '' : +el.value;
    if (path === 'template.analysis.map' || /^template\.analysis\.map\./.test(path)) v = String(v).toUpperCase().replace(/\s/g, '');
    setPath(path, v); save();
    if (el.type === 'checkbox' || el.tagName === 'SELECT' || e.type === 'change') rerenderKeep(el);
    else livePreview(el);
  }
  // лёгкое обновление без потери фокуса
  let liveT = null;
  function livePreview(el) {
    clearTimeout(liveT);
    liveT = setTimeout(() => {
      if (el.closest('.order')) { const card = el.closest('.order'); const i = [...document.querySelectorAll('.order')].indexOf(card); const pv = card.querySelector('.preview'); if (pv && P.orders[i]) pv.innerHTML = `<span>В акте:</span> ${esc(IDG.signerLine(P.orders[i]))}`; }
    }, 120);
  }
  function rerenderKeep(el) {
    const id = el && el.id; const scroll = $('#main').scrollTop; const ls = $('.alist') ? $('.alist').scrollTop : 0;
    render();
    $('#main').scrollTop = scroll; if ($('.alist')) $('.alist').scrollTop = ls;
    if (id && document.getElementById(id) && document.activeElement === document.body) { /* фокус не возвращаем после change — так привычнее */ }
  }

  function onClick(e) {
    const pj = e.target.closest('[data-proj]');
    if (pj && !e.target.closest('button')) { switchProject(pj.dataset.proj); return; }
    const tg = e.target.closest('[data-tg]');
    if (tg && !e.target.closest('button,input,select,a,label')) { toggle(tg.dataset.tg); rerenderKeep(); return; }
    const t = e.target.closest('[data-tab],[data-act],[data-sel],[data-role],[data-mat]'); if (!t) return;
    if (t.dataset.tab) { tab = t.dataset.tab; render(); $('#main').scrollTop = 0; return; }
    if (t.dataset.sel != null) { curAct = +t.dataset.sel; render(); return; }
    if (t.dataset.role) { const [i, r] = t.dataset.role.split(':').map(Number); const o = P.orders[i]; o.roles = t.checked ? [...new Set([...o.roles, r])] : o.roles.filter(x => x !== r); save(); render(); return; }
    if (t.dataset.mat) { const a = P.acts[curAct]; const k = t.dataset.mat; a.materials = t.checked ? [...new Set([...(a.materials || []), k])] : (a.materials || []).filter(x => x !== k); save(); render(); return; }
    const act = t.dataset.act;
    const A = {
      'load-template': () => loadTemplate(), 'load-estimate': () => loadEstimates(), 'open': () => openProject(), 'save': saveProject,
      'generate': () => generate(), 'gen-one': () => generate([curAct]),
      'new': () => newProject(),
      'dup-proj': () => duplicateProject(t.dataset.id),
      'del-proj': () => deleteProject(t.dataset.id),
      'add-order': () => { P.orders.unshift({ id: uid(), roles: [], position: '', fio: '', nrs: '', docType: 'приказ', number: '', date: today(), from: '', to: '', org: '', pages: 1 }); save(); render(); },
      'del-order': () => { if (confirm('Удалить приказ?')) { P.orders.splice(+t.dataset.i, 1); save(); render(); } },
      'act-from': () => {
        newAct(t.dataset.k); justAdded = t.dataset.k; rerenderKeep();
        const c = computed().acts; toast(`Акт ${c[c.length - 1].num} добавлен`);
        clearTimeout(window.__jaT); window.__jaT = setTimeout(() => { justAdded = null; document.querySelectorAll('tr.just').forEach(r => r.classList.remove('just')); }, 2600);
      },
      'goto-act': () => { curAct = +t.dataset.i; tab = 'acts'; render(); $('#main').scrollTop = 0; },
      'del-act-i': () => {
        const i = +t.dataset.i; const c = computed().acts[i]; if (!c) return;
        if (!confirm(`Удалить акт ${c.num}?\n${c.baseTitle}${i < P.acts.length - 1 ? '\n\nНомера следующих актов (если они не заданы вручную) сдвинутся.' : ''}`)) return;
        P.acts.splice(i, 1); if (curAct >= P.acts.length) curAct = Math.max(0, P.acts.length - 1); else if (curAct > i) curAct--;
        save(); rerenderKeep(); toast(`Акт ${c.num} удалён`);
      },
      'add-act': () => { newAct(null); render(); },
      'dup-act': () => { const c = JSON.parse(JSON.stringify(P.acts[curAct])); c.id = uid(); c.num = ''; c.scheme = ''; P.acts.splice(curAct + 1, 0, c); curAct++; save(); render(); },
      'del-act': () => { if (confirm('Удалить акт?')) { P.acts.splice(curAct, 1); curAct = Math.max(0, curAct - 1); save(); render(); } },
      'mv': () => { const d = +t.dataset.d, j = curAct + d; if (j < 0 || j >= P.acts.length) return; [P.acts[curAct], P.acts[j]] = [P.acts[j], P.acts[curAct]]; curAct = j; save(); render(); },
      'add-item': () => {
        const ws = works(); const a = P.acts[curAct]; a.items = a.items || [];
        const last = a.items[a.items.length - 1]; const lp = last && posIndex().get(last.posKey);
        const w = (lp && ws.find(x => x.ls === lp.ls && x.ord !== undefined ? x.ord > lp.ord : x.ls === lp.ls && +x.n > +lp.n)) || (lp && ws.find(x => x.ls === lp.ls)) || ws[0];
        a.items.push({ posKey: w.key, vol: '' }); onSelectPos({ target: { dataset: { path: `acts.${curAct}.items.${a.items.length - 1}.posKey` } } }); },
      'del-item': () => { P.acts[curAct].items.splice(+t.dataset.k, 1); save(); render(); },
      'all-mats': () => { showAllMats = t.checked; render(); },
      'add-mat': () => { P.materials.unshift({ key: 'm_' + uid(), code: 'вручную', name: '', short: '', unit: '', doc: '', skip: false, positions: [], est: t.dataset.est || '' }); toggle('mat:' + (t.dataset.est || '__none'), true); save(); render(); },
      'del-mat': () => { const m = P.materials[+t.dataset.i]; if (!m || !confirm('Удалить материал?')) return; P.materials.splice(+t.dataset.i, 1); for (const a of P.acts) a.materials = (a.materials || []).filter(k => k !== m.key); save(); render(); },
      'excl-pos': () => {
        const k = t.dataset.k; const p = posIndex().get(k); if (!p) return;
        const used = computed().acts.filter(a => (a.items || []).some(it => it.posKey === k));
        if (used.length) { alert(`По этой работе есть акты: ${used.map(a => a.num).join(', ')}.\nСначала удалите их (крестик на значке акта в строке).`); return; }
        p.excluded = true; save(); rerenderKeep(); toast(`Работа поз. ${p.n} исключена из ИД — её можно вернуть кнопкой «Показать исключённые»`);
      },
      'incl-pos': () => { const p = posIndex().get(t.dataset.k); if (p) { delete p.excluded; save(); rerenderKeep(); toast(`Работа поз. ${p.n} возвращена`); } },
      'show-excl': () => { P.ui = P.ui || {}; P.ui.showExcl = P.ui.showExcl || {}; P.ui.showExcl[t.dataset.id] = !P.ui.showExcl[t.dataset.id]; const k = 'est:' + t.dataset.id; toggle(k, true); rerenderKeep(); },
      'sum-xlsx': () => exportSummaryXlsx(),
      'sum-print': () => printSummary(),
      'sum-filter': () => { sumFilter = t.dataset.k; rerenderKeep(); },
      'fold-all': () => { const v = t.dataset.v === '1'; const sc = t.dataset.scope;
        for (const e of P.estimates) { toggle(sc + ':' + e.id, v); if (sc === 'est') for (const sec of e.sections) toggle('sec:' + e.id + '|' + sec, v); }
        if (sc === 'mat') toggle('mat:__none', v); render(); },
      'del-est': () => { if (confirm('Убрать смету из проекта? Вместе с ней удалятся её материалы (вкладка «Материалы») и ссылки на её позиции в актах. Сами акты останутся.')) { removeEstimate(+t.dataset.i); save(); render(); } },
      'gen-reg': () => generate(undefined, true),
      'add-rdoc': () => { P.registryDocs = P.registryDocs || []; P.registryDocs.push({ name: '', no: 'б/н', pages: 1, where: 'end' }); save(); render(); },
      'del-rdoc': () => { P.registryDocs.splice(+t.dataset.i, 1); save(); render(); },
    };
    if (A[act]) A[act]();
  }

  function growNote(el) { el.style.height = 'auto'; el.style.height = Math.min(160, el.scrollHeight + 2) + 'px'; }
  function onPosNote(e) {
    const el = e.target; const pth = el.dataset.path || ''; if (!pth.startsWith('posNotes.')) return false;
    P.posNotes = P.posNotes || {}; const k = pth.slice(9); if (el.value) P.posNotes[k] = el.value; else delete P.posNotes[k]; save(); return true;
  }
  function onStatus(e) {
    const el = e.target; if (el.dataset.statusI == null) return false;
    const a = P.acts[+el.dataset.statusI]; if (!a) return true;
    a.status = el.value; a.statusDate = today(); save(); rerenderKeep(); return true;
  }
  function onSelectEst(e) {
    const el = e.target; if (el.dataset.itemEst == null) return false;
    const a = P.acts[curAct]; const k = +el.dataset.itemEst; const est = P.estimates.find(x => x.id === el.value); if (!est) return true;
    const w = est.positions.find(isWork); if (!w) { toast('В этой смете нет работ', 'err'); render(); return true; }
    a.items[k].posKey = w.key; a.items[k].vol = '';
    onSelectPos({ target: { dataset: { path: `acts.${curAct}.items.${k}.posKey` } } });
    return true;
  }
  function onSelectPos(e) {
    // при смене позиции в акте — подтянуть материалы и остаток
    const el = e.target; if (!/^acts\.\d+\.items\.\d+\.posKey$/.test(el.dataset.path || '')) return;
    const a = P.acts[curAct]; const k = +el.dataset.path.split('.')[3]; const it = a.items[k];
    const p = posIndex().get(it.posKey); const { used } = computed();
    if (p && (it.vol === '' || it.vol == null)) it.vol = Math.max(0, +(p.baseQty - (used.get(it.posKey) || 0)).toFixed(4));
    a.materials = [...new Set([...(a.materials || []), ...matsForPositions([it.posKey])])];
    save(); render();
  }

  /* ── старт ── */
  document.addEventListener('DOMContentLoaded', async () => {
    try { if (window.__REG_B64) IDG.setBuiltinRegistry(IDG.b64ToU8(window.__REG_B64)); } catch (e) { }
    await loadAll();
    try { await ensureTplBook(); } catch (e) { }
    $('#main').addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('note')) growNote(e.target); if (onPosNote(e)) return; onInput(e); });
    $('#main').addEventListener('change', e => { if (onPosNote(e) || onStatus(e) || onSelectEst(e)) return; if (e.target.dataset.path) { if (/posKey$/.test(e.target.dataset.path)) { onInput(e); onSelectPos(e); } else onInput(e); } });
    document.addEventListener('click', onClick);
    $('#pname').addEventListener('input', e => { P.name = e.target.value; save(); });
    window.addEventListener('beforeunload', e => { if (saveT) flush(); if (dirty && !lsOk) { e.preventDefault(); e.returnValue = ''; } });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) flush(); });
    setupDragDrop();
    render();
  });
})();
</script>
</body>
</html>
