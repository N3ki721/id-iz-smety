<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="idgen-version" content="1.3.4">
<meta name="idgen-notes" content="• Материалы: столбец «Искл.» перенесён сразу после наименования материала">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИД из сметы</title>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1f22; --ink2:#5b6068; --ink3:#8a8f97; --line:#e2e0da; --line2:#ecebe6;
  --acc:#1f5f8b; --acc-ink:#fff; --acc-soft:#e6eff6; --ok:#2f7d4f; --ok-soft:#e5f2ea; --warn:#a2610b; --warn-soft:#fbf0dc; --bad:#b3362c; --bad-soft:#f9e4e1;
  --seg:#1f5f8b; --seg2:#3c8a6e; --r:8px; --shadow:0 1px 2px rgba(20,20,20,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191c; --panel:#202327; --ink:#e8e8e6; --ink2:#a9adb3; --ink3:#7d8289; --line:#33373d; --line2:#2a2d32;
  --acc:#5aa0d6; --acc-ink:#0d1115; --acc-soft:#1f3242; --ok:#6cc08f; --ok-soft:#1d3327; --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#ef7c71; --bad-soft:#3d2220; --seg:#4b8fc4; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#17191c; --panel:#202327; --ink:#e8e8e6; --ink2:#a9adb3; --ink3:#7d8289; --line:#33373d; --line2:#2a2d32;
  --acc:#5aa0d6; --acc-ink:#0d1115; --acc-soft:#1f3242; --ok:#6cc08f; --ok-soft:#1d3327; --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#ef7c71; --bad-soft:#3d2220; --seg:#4b8fc4; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:grid;grid-template-rows:auto 1fr;grid-template-columns:232px 1fr;grid-template-areas:"top top" "nav main"}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:5px;background:var(--acc);display:inline-grid;place-items:center;color:var(--acc-ink);font-style:normal;font-size:12px}
#pname{border:1px solid transparent;background:transparent;font:inherit;font-weight:500;padding:5px 8px;border-radius:6px;min-width:120px;width:28ch;color:var(--ink)}
#pname:hover,#pname:focus{border-color:var(--line);background:var(--bg);outline:none}
.top .sp{flex:1}
#status{color:var(--ink3);font-size:12px;max-width:360px;text-align:right}
nav{grid-area:nav;padding:14px 10px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink2);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer;position:relative}
.navbtn span{flex:1}
.navbtn b{font-weight:500;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.navbtn:hover{background:var(--bg);color:var(--ink)}
.navbtn.on{background:var(--acc-soft);color:var(--ink);font-weight:550}
.warn-dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
#projects{margin-bottom:14px}
.pj-h,.nav-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;padding:2px 4px 6px 10px}
.nav-h{padding-top:10px;border-top:1px solid var(--line2)}
.pj-h .btn{text-transform:none;letter-spacing:0;font-weight:500}
.pj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:38vh;overflow:auto}
.pj{position:relative;padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pj:hover{background:var(--bg)}
.pj.on{background:var(--panel);border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.pj-n{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.pj-m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-a{position:absolute;right:4px;top:5px;display:none;gap:0}
.pj:hover .pj-a{display:flex}
.btn.xs{padding:1px 6px;font-size:12px;line-height:1.4}
nav .foot{margin-top:18px;padding:12px 10px;border-top:1px solid var(--line2);color:var(--ink3);font-size:12px}
main{grid-area:main;overflow:auto;padding:22px 28px 60px}
main>*{max-width:1180px}
.ph h1,.ae-h h1{font-size:20px;font-weight:650;margin:0 0 4px}
.ph p{margin:0 0 16px;color:var(--ink2);max-width:780px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card.flush{padding:0;overflow:hidden}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;margin:0 0 12px}
.card-h{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;color:var(--ink);text-transform:none;letter-spacing:0;font-size:15px}
.card-h small{flex:1;color:var(--ink3)}
.card-h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.gap{gap:10px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.span2{grid-column:span 2}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.fld em{font-style:normal;color:var(--ink3);font-size:11px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
input::placeholder,textarea::placeholder{color:var(--ink3)}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
input.need{border-color:var(--warn);background:var(--warn-soft)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink2);cursor:pointer}
.chk.sm{margin:0;font-size:12px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:550}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--bg);color:var(--ink)}
.btn.danger:hover{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--ink3);font-size:13px}
.empty{color:var(--ink2);padding:24px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px;text-align:center;color:var(--ink2);background:var(--panel)}
.note{color:var(--ink3);font-size:12px;margin:10px 0 0}
.steps{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.steps .n{width:22px;height:22px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--ink3)}
.steps li.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps b{display:block;font-weight:600;font-size:13px}
.steps small{color:var(--ink3);font-size:12px;word-break:break-word}
/* таблицы */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}.tbl .c{text-align:center}.nw{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.sec td{background:var(--bg);font-weight:600;color:var(--ink2);font-size:12px}
.tbl tr.material td,.tbl tr.equipment td{color:var(--ink2)}
.code{color:var(--ink3);font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.tag{margin-left:6px;font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
td.neg,small.neg{color:var(--bad);font-weight:600}
td.done{color:var(--ok)}
.tbl.mats td:nth-child(1){width:40%}
.tbl.mats td input{padding:5px 7px}
.tbl.mats td.skipc{width:52px}
.tbl.mats tr.skip td.skipc{opacity:1}
.tbl tr.skip td{opacity:.5}
.mname{line-height:1.3}
.tbl.map td:first-child{width:60%}
.tg{cursor:pointer;user-select:none}
.card-h.tg:hover{background:var(--bg)}
.fold.closed .card-h{border-bottom:0}
.chev{display:inline-block;width:0;height:0;border-left:5px solid var(--ink3);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:8px;transition:transform .15s;vertical-align:middle;flex:none}
.chev.open{transform:rotate(90deg)}
.card-h{align-items:center}
.card-h .stat{font-size:12px;color:var(--ink3);white-space:nowrap}
.warn-t{color:var(--warn);font-weight:600}.ok-t{color:var(--ok);font-weight:500}
.row .sp{flex:1}
.pad{padding:14px 16px;margin:0}
.tbl.mats td:last-child{width:34px}
.tbl .res{font-size:12px;color:var(--ink3);margin-top:3px}
.tbl tr.in-act td{background:var(--ok-soft)}
.tbl tr.in-act td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.tbl tr.just td{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:color-mix(in srgb,var(--ok) 32%,var(--panel))}100%{background:var(--ok-soft)}}
.achips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.achip{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:12px;background:var(--panel);overflow:hidden;font-size:12px}
.achip button{border:0;background:none;font:inherit;color:var(--ok);cursor:pointer;padding:2px 8px}
.achip .achip-n{font-weight:600}
.achip .achip-n:hover{text-decoration:underline}
.achip .achip-x{color:var(--ink3);padding:2px 7px 2px 4px}
.achip .achip-x:hover{color:var(--bad)}
.item .pick{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:6px;min-width:0}
.item .pick select{min-width:0}
input.pg{width:64px;text-align:center;padding:5px 4px}
.tbl.rdocs td input,.tbl.rdocs td select{padding:5px 7px}
.tbl.rdocs td:first-child{width:52%}
.tbl.reg tr.k-act td{font-weight:550}
.tbl.reg tr.k-order td,.tbl.reg tr.k-reg td{color:var(--ink2)}
.grid2.inner{gap:12px}
.tbl.map input.addr{width:110px;font-family:ui-monospace,Menlo,Consolas,monospace}
/* приказы */
.order-h{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.order.off{opacity:.55}
.roles{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);cursor:pointer;user-select:none}
.pill input{display:none}
.pill.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.preview{margin-top:12px;padding:9px 12px;border-radius:6px;background:var(--bg);font-size:13px;color:var(--ink)}
.preview>span{color:var(--ink3);margin-right:6px;font-size:12px}
.preview pre{margin:4px 0 0;font:inherit;white-space:pre-wrap}
details{margin-top:8px}summary{cursor:pointer;color:var(--ink3);font-size:12px}
details .fld{margin-top:8px}
.tl{position:relative}
.tl-axis{position:relative;height:18px;margin-left:130px;font-size:11px;color:var(--ink3)}
.tl-axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-row{display:flex;align-items:center;gap:0;margin:4px 0}
.tl-l{width:130px;flex:none;font-size:12px;color:var(--ink2)}
.tl-track{position:relative;flex:1;height:26px;background:var(--bg);border-radius:5px}
.tl-track .grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.tl-track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink3);opacity:.55;z-index:2;border-radius:1px}
.seg{position:absolute;top:3px;bottom:3px;background:var(--seg);border-radius:4px;color:#fff;font-size:11.5px;overflow:hidden;display:flex;align-items:center;padding:0 7px;border-right:2px solid var(--panel)}
.seg:nth-child(odd){background:var(--seg2)}
.seg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.empty{background:repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 6px,transparent 6px,transparent 12px);color:var(--bad)}
/* акты */
.acts{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;max-width:1280px}
.alist{position:sticky;top:0;max-height:calc(100vh - 110px);overflow:auto}
.alist ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.alist li{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;cursor:pointer}
.alist li:hover{border-color:var(--ink3)}
.alist li.on{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.ah{display:flex;gap:8px;align-items:center}
.ah b{font-variant-numeric:tabular-nums}
.ah span{color:var(--ink3);font-size:12px;flex:1}
.ah .w{font-style:normal;font-size:11px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:0 7px;font-weight:600}
.at{font-size:12.5px;color:var(--ink);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.as{font-size:11.5px;color:var(--ink3);margin-top:3px}
.ae-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.ae-h p{margin:0;color:var(--ink2);max-width:700px}
.ae-h .row{flex-wrap:nowrap;flex:none}
.warns{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.signers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sg{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sg span{font-size:11px;color:var(--ink3)}
.sg b{font-weight:600;font-size:13px}
.sg small{font-size:11px;color:var(--ink2)}
.sg.miss{background:var(--bad-soft);border-color:transparent}.sg.miss b{color:var(--bad)}
.sg.none b{color:var(--ink3);font-weight:400}
.item{display:grid;grid-template-columns:1fr 150px auto auto;gap:8px;align-items:center;margin-bottom:8px}
.item small{color:var(--ink3);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.vol{display:flex;align-items:center;gap:6px}.vol span{color:var(--ink3);font-size:12px;min-width:24px}
.card .fld{margin-top:0}
section.card>.fld{margin-top:12px}
.mlist{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;max-height:340px;overflow:auto}
.mi{display:grid;grid-template-columns:auto 1fr;column-gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer}
.mi:hover{background:var(--bg)}
.mi input{grid-row:span 2;margin-top:3px}
.mi small{color:var(--ink3);font-size:12px}
.mi.nodoc small{color:var(--warn)}
#dropov{position:fixed;inset:0;z-index:30;display:none;place-items:center;pointer-events:none;background:color-mix(in srgb,var(--bg) 70%,transparent);}
#dropov.on{display:grid}
#dropov>div{border:2px dashed var(--acc);border-radius:14px;padding:34px 46px;background:var(--panel);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:6px}
#dropov b{font-size:17px;font-weight:600}
#dropov small{color:var(--ink3)}
[data-drop].hot{outline:2px solid var(--acc);outline-offset:2px;background:var(--acc-soft)}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:20}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;max-width:420px;box-shadow:0 6px 20px rgba(0,0,0,.18);transition:opacity .4s,transform .4s}
.toast.err{background:var(--bad);color:#fff}
.toast.out{opacity:0;transform:translateY(6px)}
@media (max-width:900px){
  body{grid-template-columns:1fr;grid-template-areas:"top" "nav" "main"}
  nav{overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  #nav{display:flex;gap:2px}
  .nav-h{display:none}
  .pj-list{max-height:none;flex-direction:row;overflow-x:auto}.pj{min-width:180px}
  .navbtn{width:auto;white-space:nowrap}
  #projects{margin-bottom:14px}
.pj-h,.nav-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;padding:2px 4px 6px 10px}
.nav-h{padding-top:10px;border-top:1px solid var(--line2)}
.pj-h .btn{text-transform:none;letter-spacing:0;font-weight:500}
.pj-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:38vh;overflow:auto}
.pj{position:relative;padding:7px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.pj:hover{background:var(--bg)}
.pj.on{background:var(--panel);border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.pj-n{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:44px}
.pj-m{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-a{position:absolute;right:4px;top:5px;display:none;gap:0}
.pj:hover .pj-a{display:flex}
.btn.xs{padding:1px 6px;font-size:12px;line-height:1.4}
nav .foot{display:none}
  main{padding:16px}
  .grid2,.grid4,.steps,.signers{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .acts{grid-template-columns:1fr}.alist{position:static;max-height:none}
  .item{grid-template-columns:1fr}
  #status{display:none}
  .top{flex-wrap:wrap}
}
@media print{nav,.top{display:none}}

/* стадии ИД */
:root{--st-work:#8a8f97;--st-check:#c58a1a;--st-sign:#2f6fb0;--st-done:#2f7d4f;--st-rej:#b3362c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--st-work:#8d939b;--st-check:#e3a54a;--st-sign:#5aa0d6;--st-done:#6cc08f;--st-rej:#ef7c71}}
.lg-work{background:var(--st-work)}.lg-check{background:var(--st-check)}.lg-sign{background:var(--st-sign)}.lg-done{background:var(--st-done)}.lg-rej{background:var(--st-rej)}
.dn-work{stroke:var(--st-work)}.dn-check{stroke:var(--st-check)}.dn-sign{stroke:var(--st-sign)}.dn-done{stroke:var(--st-done)}.dn-rej{stroke:var(--st-rej)}.dn-bg{stroke:var(--line2)}
.donut{width:150px;height:150px;flex:none}
.dn-big{font-size:20px;font-weight:700;fill:var(--ink)}.dn-sub{font-size:8.5px;fill:var(--ink3)}
.dash{display:grid;grid-template-columns:auto 1fr;gap:18px 28px;align-items:start}
.dash-donut{display:flex;gap:18px;align-items:center;grid-row:span 2}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px}.legend li b{margin-left:auto;padding-left:14px;font-variant-numeric:tabular-nums}

<script>/* Ядро генератора исполнительной документации.
   Без внешних зависимостей: ZIP через (De)CompressionStream, XML — строковой обработкой.
   Работает и в браузере, и в Node 22 (для тестов). */
(function (root) {
  'use strict';
  const enc = new TextEncoder();
  const dec = new TextDecoder('utf-8');

  /* ───────────── ZIP ───────────── */
  async function streamThrough(u8, ts) {
    const s = new Blob([u8]).stream().pipeThrough(ts);
    return new Uint8Array(await new Response(s).arrayBuffer());
  }
  const inflateRaw = u8 => streamThrough(u8, new DecompressionStream('deflate-raw'));
  const deflateRaw = u8 => streamThrough(u8, new CompressionStream('deflate-raw'));

  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  async function readZip(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let p = u8.length - 22;
    while (p >= 0 && dv.getUint32(p, true) !== 0x06054b50) p--;
    if (p < 0) throw new Error('Файл не похож на .xlsx (не найден ZIP-каталог)');
    const count = dv.getUint16(p + 10, true);
    let q = dv.getUint32(p + 16, true);
    const out = new Map();
    for (let i = 0; i < count; i++) {
      if (dv.getUint32(q, true) !== 0x02014b50) throw new Error('Повреждён ZIP');
      const method = dv.getUint16(q + 10, true), csize = dv.getUint32(q + 20, true);
      const nl = dv.getUint16(q + 28, true), xl = dv.getUint16(q + 30, true), cl = dv.getUint16(q + 32, true);
      const lo = dv.getUint32(q + 42, true);
      const name = dec.decode(u8.subarray(q + 46, q + 46 + nl));
      const start = lo + 30 + dv.getUint16(lo + 26, true) + dv.getUint16(lo + 28, true);
      const raw = u8.subarray(start, start + csize);
      if (!name.endsWith('/')) out.set(name, method === 0 ? raw.slice() : await inflateRaw(raw));
      q += 46 + nl + xl + cl;
    }
    return out;
  }

  async function writeZip(files) { // files: Array<[name, Uint8Array|string]>
    const parts = [], central = []; let off = 0;
    for (const [name, data0] of files) {
      const data = typeof data0 === 'string' ? enc.encode(data0) : data0;
      const nm = enc.encode(name), comp = await deflateRaw(data), crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 8, true);
      lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, comp.length, true);
      lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
      parts.push(new Uint8Array(lh.buffer), nm, comp);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint16(10, 8, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
      ch.setUint32(20, comp.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true);
      ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nm);
      off += 30 + nm.length + comp.length;
    }
    const cdSize = central.reduce((a, b) => a + b.length, 0);
    const eo = new DataView(new ArrayBuffer(22));
    eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
    eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true);
    const all = [...parts, ...central, new Uint8Array(eo.buffer)];
    const res = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let k = 0;
    for (const a of all) { res.set(a, k); k += a.length; }
    return res;
  }

  /* ───────────── XML helpers ───────────── */
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const unesc = s => String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-f]+);/gi, (_, h) => String.fromCodePoint(parseInt(h, 16))).replace(/&#(\d+);/g, (_, d) => String.fromCodePoint(+d)).replace(/&amp;/g, '&');
  function attr(s, name) { const m = new RegExp('(?:^|\\s)' + name.replace(':', '\\:') + '="([^"]*)"').exec(s); return m ? unesc(m[1]) : null; }
  function setAttr(s, name, val) {
    const re = new RegExp('(\\s)' + name + '="[^"]*"');
    if (val == null) return s.replace(re, '');
    return re.test(s) ? s.replace(re, (m, sp) => `${sp}${name}="${esc(val)}"`) : s + ` ${name}="${esc(val)}"`;
  }
  const colNum = c => { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const splitAddr = a => { const m = /^([A-Z]+)(\d+)$/.exec(a); return m ? [m[1], +m[2]] : null; };
  const textOf = xml => { // текст из <si>/<is>
    let out = ''; const re = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>|<t\s*\/>/g; let m;
    // пропускаем фонетические подсказки
    xml = xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '');
    while ((m = re.exec(xml))) out += unesc(m[1] || '');
    return out;
  };

  /* ───────────── Чтение xlsx ───────────── */
  async function openXlsx(buf) {
    const files = await readZip(buf);
    const txt = n => files.has(n) ? dec.decode(files.get(n)) : null;
    const wbXml = txt('xl/workbook.xml');
    if (!wbXml) throw new Error('В файле нет листов Excel (xl/workbook.xml)');
    const rels = {};
    for (const m of (txt('xl/_rels/workbook.xml.rels') || '').matchAll(/<Relationship\b([^>]*)\/?>/g)) {
      let t = attr(m[1], 'Target'); t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
      rels[attr(m[1], 'Id')] = { target: t, type: attr(m[1], 'Type') };
    }
    const sheets = [...wbXml.matchAll(/<sheet\b([^>]*?)\/>/g)].map(m => ({
      name: attr(m[1], 'name'), rid: attr(m[1], 'r:id'), state: attr(m[1], 'state') || 'visible',
      path: rels[attr(m[1], 'r:id')].target
    }));
    const sstXml = txt('xl/sharedStrings.xml') || '';
    const sst = [...sstXml.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m => textOf(m[1]));
    const book = { files, sheets, sst, rels, wbXml, txt };
    book.styles = parseStyles(txt('xl/styles.xml') || '');
    return book;
  }

  function parseStyles(xml) {
    const fontsXml = (/<fonts\b[^>]*>([\s\S]*?)<\/fonts>/.exec(xml) || [])[1] || '';
    const fonts = [...fontsXml.matchAll(/<font\b[^>]*?(?:\/>|>([\s\S]*?)<\/font>)/g)].map(m => {
      const sz = /<sz val="([\d.]+)"/.exec(m[1] || ''); return { sz: sz ? +sz[1] : 11 };
    });
    const xfsXml = (/<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs>/.exec(xml) || [])[1] || '';
    const xfs = [...xfsXml.matchAll(/<xf\b([^>]*?)(?:\/>|>[\s\S]*?<\/xf>)/g)].map(m => ({ fontId: +(attr(m[1], 'fontId') || 0), numFmtId: +(attr(m[1], 'numFmtId') || 0) }));
    const fmts = {}; for (const m of xml.matchAll(/<numFmt\b([^>]*)\/>/g)) fmts[attr(m[1], 'numFmtId')] = attr(m[1], 'formatCode') || '';
    const isDate = s => {
      const id = (xfs[s] || {}).numFmtId || 0;
      if ((id >= 14 && id <= 22) || (id >= 27 && id <= 36) || (id >= 45 && id <= 47) || (id >= 50 && id <= 58)) return true;
      const code = (fmts[id] || '').replace(/"[^"]*"|\\.|\[[^\]]*\]/g, '');
      return id >= 164 && /[dyд]/i.test(code) && /m|м/i.test(code);
    };
    return { fonts, xfs, isDate, fontSize: s => (fonts[(xfs[s] || {}).fontId || 0] || { sz: 11 }).sz };
  }

  /* Разбор <sheetData> в структуру, пригодную для правки и обратной сборки */
  function parseSheet(xml) {
    const a = xml.indexOf('<sheetData'), b = xml.lastIndexOf('</sheetData>');
    let head, body, tail;
    if (/<sheetData\s*\/>/.test(xml)) { const m = /<sheetData\s*\/>/.exec(xml); head = xml.slice(0, m.index); body = ''; tail = xml.slice(m.index + m[0].length); }
    else { const gt = xml.indexOf('>', a); head = xml.slice(0, a); body = xml.slice(gt + 1, b); tail = xml.slice(b + 12); }
    const rows = [];
    const reRow = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g; let m;
    while ((m = reRow.exec(body))) {
      const cells = [];
      const reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let c;
      while ((c = reC.exec(m[2] || ''))) cells.push({ attrs: c[1], inner: c[2] || '', r: attr(c[1], 'r') });
      rows.push({ attrs: m[1], r: +attr(m[1], 'r'), cells });
    }
    return { head, rows, tail };
  }
  function buildSheet(p) {
    const body = p.rows.map(r => {
      const inner = r.cells.map(c => c.inner ? `<c${c.attrs}>${c.inner}</c>` : `<c${c.attrs}/>`).join('');
      return inner ? `<row${r.attrs}>${inner}</row>` : `<row${r.attrs}/>`;
    }).join('');
    return `${p.head}<sheetData>${body}</sheetData>${p.tail}`;
  }

  function cellValue(book, c) {
    const t = attr(c.attrs, 't'); const v = /<v>([\s\S]*?)<\/v>/.exec(c.inner); const f = /<f\b[^>]*>([\s\S]*?)<\/f>/.exec(c.inner);
    let val = null;
    if (t === 's') val = v ? book.sst[+v[1]] : null;
    else if (t === 'inlineStr') { const is = /<is>([\s\S]*?)<\/is>/.exec(c.inner); val = is ? textOf(is[1]) : ''; }
    else if (t === 'str' || t === 'e') val = v ? unesc(v[1]) : null;
    else if (t === 'b') val = v ? v[1] === '1' : null;
    else val = v ? Number(v[1]) : null;
    if (typeof val === 'string') val = val.replace(/\r\n?/g, '\n');
    return { v: val, f: f ? unesc(f[1]) : null, s: +(attr(c.attrs, 's') || 0), t };
  }

  function sheetCells(book, sheetName) {
    const sh = book.sheets.find(s => s.name === sheetName); if (!sh) return null;
    const p = parseSheet(book.txt(sh.path));
    const map = new Map();
    for (const r of p.rows) for (const c of r.cells) { const cv = cellValue(book, c); if (cv.v !== null && cv.v !== '' || cv.f) map.set(c.r, cv); }
    return map;
  }

  /* ───────────── Даты ───────────── */
  const isoToSerial = iso => { if (!iso) return null; const [y, m, d] = iso.split('-').map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
  const serialToIso = n => { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(n) * 864e5); return d.toISOString().slice(0, 10); };
  const fmtDate = iso => iso ? iso.split('-').reverse().join('.') : '';
  const parseRuDate = s => { const m = /(\d{1,2})\.(\d{1,2})\.(\d{4})/.exec(s || ''); return m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : null; };

  /* ───────────── Смета (выгрузка ГРАНД-Сметы, форма по 421/пр) ───────────── */
  const UNIT_MULT = u => {
    const s = String(u || '').trim();
    let m = /^(\d+)\s+(.+)$/.exec(s); if (m) return { k: +m[1], base: m[2] };
    if (/^км$/i.test(s)) return { k: 1000, base: 'м' };
    if (/^т$/i.test(s)) return { k: 1, base: 'т' };
    return { k: 1, base: s.replace(/\.$/, '') };
  };
  const WORK_RE = /^(ГЭСН|ФЕР|ТЕР|ГЭСНм|ГЭСНп|ГЭСНр|ФЕРм|ТЕРм|ФЕРп|ТЕРп|ЕНиР|ВСН)/i;
  const MAT_POS_RE = /^(ФСБЦ|ФССЦ|ТСЦ|ТССЦ|ТЦ|КА|Прайс|прайс|СЦМ)/i;
  const RES_CODE_RE = /^\d{2}\.\d/;
  const SKIP_MAT = /^(Вода|Электроэнергия|Пар\b|Сжатый воздух)/i;

  // Нормализация единиц из договорных расчётов: «М³» → «м3», «ПОГ М» → «м» и т.п.
  function normUnit(u) {
    let s = String(u || '').trim(); if (!s) return '';
    s = s.replace(/³/g, '3').replace(/²/g, '2');
    const low = s.toLowerCase().replace(/\s+/g, ' ');
    const MAP = { 'пог м': 'м', 'пог. м': 'м', 'п.м': 'м', 'п.м.': 'м', 'м.п.': 'м', 'тыс шт': 'тыс. шт', 'тыс.шт': 'тыс. шт' };
    return MAP[low] || low;
  }
  const isCalcHeader = s => /^Кол-?во\.?$/i.test(s) || /^Код затрат/i.test(s) || /РАСЧ[ЕЁ]Т СТОИМОСТИ/i.test(s);

  async function parseEstimate(buf, fileName) {
    const book = await openXlsx(buf);
    const sh = book.sheets.find(s => s.state === 'visible') || book.sheets[0];
    const cells = sheetCells(book, sh.name);
    const get = (col, r) => { const c = cells.get(col + r); return c ? c.v : null; };
    let maxRow = 0; for (const k of cells.keys()) maxRow = Math.max(maxRow, splitAddr(k)[1]);
    // Формат «Расчёт стоимости» (договорная смета с иерархической нумерацией 1.1.2.3)
    const vals = [...cells.values()].map(c => String(c.v || '').trim());
    if (!vals.some(v => /^Наименование работ и затрат/i.test(v)) && vals.some(isCalcHeader)) return parseCalcEstimate(cells, get, maxRow, fileName);
    // колонки по шапке
    let cName = 'C', cUnit = 'H', cQty = 'K', cCode = 'B', cNum = 'A', hdr = 0;
    for (const [addr, c] of cells) {
      const s = String(c.v || '');
      if (/^Наименование работ и затрат/i.test(s)) { cName = splitAddr(addr)[0]; hdr = splitAddr(addr)[1]; }
      if (/^Единица измерения/i.test(s)) cUnit = splitAddr(addr)[0];
      if (/^всего с учетом коэффициентов/i.test(s)) cQty = splitAddr(addr)[0];
      if (/^Обоснование$/i.test(s.trim())) cCode = splitAddr(addr)[0];
    }
    let title = '', object = '', basis = '';
    for (let r = 1; r < (hdr || 40); r++) {
      const a = String(get('A', r) || '');
      if (/СМЕТНЫЙ РАСЧЕТ|СМЕТА №/i.test(a) && !title) title = a.replace(/\s+/g, ' ').trim();
      if (/^\(наименование объекта/i.test(a)) object = String(get('A', r - 1) || '');
      if (/^Основание/i.test(a)) basis = String(get('B', r) || '');
    }
    const lsNum = (/№\s*([^\s]+)/.exec(title) || [])[1] || (fileName || 'Смета').replace(/\.xlsx?$/i, '');
    const sections = []; const positions = []; let cur = null; let sect = '';
    for (let r = (hdr || 1) + 1; r <= maxRow; r++) {
      const a = get(cNum, r); const as = a == null ? '' : String(a).trim();
      const b = get(cCode, r); const bs = b == null ? '' : String(b).split('\n')[0].trim();
      const name = get(cName, r); const ns = name == null ? '' : String(name).trim();
      if (/^Раздел\s/i.test(as)) { sect = as.replace(/\s+/g, ' '); sections.push(sect); cur = null; continue; }
      const numM = /^(\d+)(?:\s*\n?\s*(О))?$/.exec(as);
      if (numM && ns && !/^\d+$/.test(ns)) {
        const unit = String(get(cUnit, r) || '').trim();
        let qty = Number(get(cQty, r)); if (!isFinite(qty) || qty === 0) qty = Number(get('I', r)) || 0;
        const kind = numM[2] ? 'equipment' : WORK_RE.test(bs) ? 'work' : MAT_POS_RE.test(bs) ? 'material' : 'work';
        const um = UNIT_MULT(unit);
        cur = { key: `${lsNum}#${numM[1]}`, ls: lsNum, n: +numM[1], code: bs, name: ns.replace(/\s+/g, ' '), unit, qty, kind, section: sect,
          baseUnit: um.base, baseQty: +(qty * um.k).toFixed(4), resources: [], row: r };
        positions.push(cur); continue;
      }
      if (/^\d+\.\d+$/.test(as)) { cur = cur; continue; } // вспомогательные (%), не позиции
      if (cur && !as && RES_CODE_RE.test(bs) && !/^91\./.test(bs) && ns && !/^ОТ|^ЭМ|^М$/.test(ns)) {
        const unit = String(get(cUnit, r) || '').trim();
        cur.resources.push({ code: bs, name: ns.replace(/\s+/g, ' '), unit, qty: Number(get(cQty, r)) || 0 });
      }
    }
    // материалы-позиции, идущие сразу за работой, относим к этой работе
    let lastWork = null;
    for (const p of positions) {
      if (p.kind === 'work') lastWork = p;
      else if (lastWork && p.section === lastWork.section) { p.parent = lastWork.key; (lastWork.linked = lastWork.linked || []).push(p.key); }
      if (p.kind === 'work' && p !== lastWork) lastWork = p;
    }
    return { id: lsNum, title, object, basis, fileName, sections, positions };
  }

  /* Договорный «Расчёт стоимости»: № п/п | Код затрат | Наименование | Норма | Ед. изм. | Кол-во | Цена (Материалы, СМР) | Стоимость (Материалы, СМР)…
     Строки без единицы и количества — группы (Корпус, Секция); строки с ценой/стоимостью СМР — работы;
     вложенные в работу строки (1.1.2 → 1.1.2.1) — её материалы. */
  function parseCalcEstimate(cells, get, maxRow, fileName) {
    let hdr = 0; const col = {};
    for (const [addr, c] of cells) { const s = String(c.v || '').trim(); if (/^№\s*п\/п/i.test(s)) { hdr = splitAddr(addr)[1]; col.num = splitAddr(addr)[0]; break; } }
    if (!hdr) throw new Error('не найдена шапка таблицы (№ п/п)');
    const smr = [], mat = [];
    for (const [addr, c] of cells) {
      const [cc, r] = splitAddr(addr); const s = String(c.v || '').replace(/\s+/g, ' ').trim();
      if (r === hdr) {
        if (/^Код/i.test(s)) col.code = cc; else if (/^Наименование/i.test(s)) col.name = cc;
        else if (/^Ед\.?\s*изм/i.test(s)) col.unit = cc; else if (/^Кол-?во/i.test(s)) col.qty = cc;
      }
      if (r === hdr + 1) { if (/^СМР$/i.test(s)) smr.push(cc); if (/^Материал/i.test(s)) mat.push(cc); }
    }
    col.code = col.code || 'B'; col.name = col.name || 'C'; col.unit = col.unit || 'E'; col.qty = col.qty || 'F';
    let title = '', object = '', basis = '', contract = '';
    for (let r = 1; r < hdr; r++) for (const cc of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const v = String(get(cc, r) || '').replace(/\s+/g, ' ').trim(); if (!v) continue;
      if (/^РАСЧ[ЕЁ]Т СТОИМОСТИ/i.test(v)) title = v;
      else if (/^на объекте/i.test(v)) object = v.replace(/^на объекте:?\s*/i, '').replace(/^«|»$/g, '');
      else if (/^Основание/i.test(v)) basis = v.replace(/^Основание:?\s*/i, '');
      else if (/^(Договор|Дополнительное соглашение)/i.test(v)) contract = contract ? contract + '; ' + v : v;
    }
    const stem = String(fileName || 'Расчёт').replace(/\.xlsx?$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim();
    const id = stem.length > 40 ? stem.slice(0, 40).trim() + '…' : stem;
    const positions = [], sections = [], groups = [], warnings = []; let ord = 0, lastWork = null;
    const num = v => Number(String(v == null ? '' : v).replace(',', '.')) || 0;
    for (let r = hdr + 2; r <= maxRow; r++) {
      const n = String(get(col.num, r) == null ? '' : get(col.num, r)).trim();
      const name = String(get(col.name, r) || '').replace(/\s+/g, ' ').trim();
      if (/^ВСЕГО/i.test(name)) break;
      if (!/^\d+(\.\d+)*$/.test(n) || !name || /^\d+$/.test(name)) continue;
      const unit = normUnit(get(col.unit, r)); const qty = num(get(col.qty, r));
      const depth = n.split('.').length;
      if (!unit && !qty) { // группа: Корпус / Секция
        while (groups.length && groups[groups.length - 1].depth >= depth) groups.pop();
        groups.push({ depth, n, name }); lastWork = null;
        const sec = groups.map(g => g.name).join(', ');
        if (!sections.includes(sec)) sections.push(sec);
        continue;
      }
      const code = String(get(col.code, r) || '').trim();
      const isWork = smr.some(cc => num(get(cc, r)) !== 0);
      let parent = [...positions].reverse().find(p => p.kind === 'work' && n.startsWith(p.n + '.'));
      if (!isWork && !parent && lastWork) { // номер сбит в самом расчёте — относим к работе строкой выше
        parent = lastWork; warnings.push(`строка ${r}: «${name}» с № ${n} стоит под работой № ${lastWork.n} — отнесён к ней`);
      }
      if (!isWork && parent) { parent.resources.push({ code, name, unit, qty, main: true }); continue; }
      while (groups.length && !n.startsWith(groups[groups.length - 1].n + '.')) groups.pop();
      const sect = groups.map(g => g.name).join(', ');
      if (sect && !sections.includes(sect)) sections.push(sect);
      const um = UNIT_MULT(unit);
      positions.push({ key: `${id}#${n}`, ls: id, n, ord: ord++, code, name, unit, qty, kind: isWork ? 'work' : 'material', section: sect, loc: sect,
        baseUnit: um.base, baseQty: +(qty * um.k).toFixed(4), resources: [], row: r });
      lastWork = isWork ? positions[positions.length - 1] : null;
    }
    if (!positions.length) throw new Error('в расчёте не найдено ни одной работы');
    if (!sections.length) sections.push('');
    for (const p of positions) if (!sections.includes(p.section)) sections.push(p.section);
    return { id, title: title || stem, object, basis: basis || contract, fileName, sections: sections.filter(x => positions.some(p => p.section === x)), positions, format: 'calc', warnings };
  }

  // Справочник материалов из сметы: ресурсы внутри расценок + позиции ФСБЦ/ТЦ
  function materialsFromEstimate(est) {
    const out = []; const seen = new Map();
    const add = (code, name, unit, posKey, main) => {
      const k = (code + '|' + name).toLowerCase();
      let m = seen.get(k);
      if (!m) { m = { key: k, code, name, short: '', unit, doc: '', skip: SKIP_MAT.test(name), main: !!main, positions: [] }; seen.set(k, m); out.push(m); }
      if (main) m.main = true;
      if (!m.positions.includes(posKey)) m.positions.push(posKey);
      return m;
    };
    for (const p of est.positions) {
      if (p.kind === 'work') for (const r of p.resources) add(r.code, r.name, r.unit, p.key, r.main);
      else add(p.code, p.name, p.unit, p.parent || p.key, true);
    }
    return out;
  }

  /* ───────────── Подписанты по приказам ───────────── */
  const ROLES = [
    { id: 1, short: 'Застройщик (СК)', full: 'Представитель застройщика, технического заказчика по вопросам строительного контроля', required: true },
    { id: 2, short: 'Подрядчик', full: 'Представитель лица, осуществляющего строительство', required: true },
    { id: 3, short: 'Подрядчик (СК)', full: 'Представитель лица, осуществляющего строительство, по вопросам строительного контроля', required: true },
    { id: 4, short: 'Проектировщик', full: 'Представитель лица, осуществляющего подготовку проектной документации', required: false },
    { id: 5, short: 'Исполнитель работ', full: 'Представитель лица, выполнившего работы, подлежащие освидетельствованию', required: false },
  ];
  function pickSigner(orders, role, dateIso) {
    if (!dateIso) return null;
    const cand = orders.filter(o => (o.roles || []).includes(role) && !o.disabled)
      .filter(o => { const from = o.from || o.date; return from && from <= dateIso && (!o.to || o.to >= dateIso); })
      .sort((a, b) => ((b.from || b.date) > (a.from || a.date) ? 1 : (b.from || b.date) < (a.from || a.date) ? -1 : (b.date || '') > (a.date || '') ? 1 : -1));
    return cand[0] || null;
  }
  function signerLine(o) {
    if (!o) return '-';
    if (o.lineOverride) return o.lineOverride;
    const parts = [];
    let head = [o.position, o.fio].filter(Boolean).join(' ');
    parts.push(head);
    if (o.nrs) parts.push('и.н.с. ' + o.nrs);
    if (o.number) parts.push(`${o.docType || 'приказ'} №${o.number}${o.date ? ' от ' + fmtDate(o.date) + 'г.' : ''}`);
    if (o.org) parts.push(o.org);
    return parts.filter(Boolean).join(', ');
  }

  // Разбор готовой строки представителя из шаблона в карточку приказа
  function parseSignerLine(line) {
    const s = String(line || '').replace(/\s+/g, ' ').trim(); if (!s || s === '-') return null;
    const fioM = /([А-ЯЁ][а-яё]+(?:-[А-ЯЁ][а-яё]+)?)\s+([А-ЯЁ]\.\s?[А-ЯЁ]\.)/.exec(s);
    const nrsM = /и\.?\s?н\.?\s?с\.?\s*([A-ZА-Я]-\d{2}-\d+)/i.exec(s);
    const ordM = /(приказ|распоряжение|доверенность)\s*№\s*([^\s,]+)\s*от\s*(\d{1,2}\.\d{1,2}\.\d{4})\s*г?\.?/i.exec(s);
    const o = { position: '', fio: '', nrs: '', number: '', date: '', org: '', docType: 'приказ' };
    if (fioM) { o.fio = `${fioM[1]} ${fioM[2].replace(/\s/g, '')}`; o.position = s.slice(0, fioM.index).replace(/[,\s]+$/, '').trim(); }
    if (nrsM) o.nrs = nrsM[1];
    if (ordM) { o.docType = ordM[1].toLowerCase(); o.number = ordM[2]; o.date = parseRuDate(ordM[3]); o.org = s.slice(ordM.index + ordM[0].length).replace(/^[,\s]+/, '').trim(); }
    o.from = o.date;
    return o;
  }

  /* ───────────── Расчёт актов ───────────── */
  const fmtNum = x => { const r = Math.round(x * 1000) / 1000; return String(r).replace('.', ','); };
  function computeActs(project) {
    const posMap = new Map(); for (const e of project.estimates || []) for (const p of e.positions) posMap.set(p.key, p);
    const matMap = new Map((project.materials || []).map(m => [m.key, m]));
    const used = new Map();
    const acts = project.acts || [];
    const res = acts.map((a, i) => {
      const num = a.num || `${(project.object.numStart || 1) + i}${project.object.numSuffix || ''}`;
      const items = (a.items || []).map(it => ({ ...it, pos: posMap.get(it.posKey) })).filter(it => it.pos);
      for (const it of items) used.set(it.posKey, (used.get(it.posKey) || 0) + (+it.vol || 0));
      const baseTitle = a.title || (items[0] ? cleanWorkName(items[0].pos.name) + (items[0].pos.loc ? ` (${items[0].pos.loc})` : '') : '');
      const volTxt = items.filter(it => +it.vol).map(it => `${fmtNum(+it.vol)} ${it.pos.baseUnit}`).join(', ');
      const title = baseTitle + (a.volInTitle !== false && volTxt ? ` в объёме ${volTxt}` : '');
      const mats = (a.materials || []).map(k => matMap.get(k)).filter(Boolean);
      const matsTxt = mats.length ? mats.map(m => (m.short || m.name) + (m.doc ? ` (${m.doc})` : '')).join(', ') : (a.matsNone || 'н/п');
      const scheme = a.scheme != null && a.scheme !== '' ? a.scheme : (project.object.schemeAuto !== false ? `Исполнительная схема №${a.schemeNo || ((project.object.schemePrefix || '') + (i + 1))} ${baseTitle} от ${fmtDate(a.date)}` : '');
      const docs = [scheme, a.docsExtra].filter(Boolean).join('; ') || '-';
      const appList = [scheme, ...(String(a.docsExtra || '').split(/;\s*|\n/).filter(Boolean)), ...mats.filter(m => m.doc).map(m => m.doc)];
      const apps = appList.length ? [...new Set(appList)].map((t, k) => `${k + 1}. ${t}`).join('\n') : '-';
      const signers = {}; const warnings = [];
      for (const r of ROLES) {
        const o = pickSigner(project.orders || [], r.id, a.date);
        signers[r.id] = o;
        if (!o && r.required) warnings.push(`нет действующего приказа: ${r.short} на ${fmtDate(a.date) || '(дата не задана)'}`);
      }
      if (!a.date) warnings.push('не задана дата акта');
      if (a.start && a.end && a.start > a.end) warnings.push('дата начала позже даты окончания');
      if (a.end && a.date && a.end > a.date) warnings.push('акт датирован раньше окончания работ');
      for (const m of mats) if (!m.doc) warnings.push(`нет документа о качестве: ${m.short || m.name}`);
      return { src: a, idx: i, num, title, baseTitle, items, mats, matsTxt, scheme, docs, apps, signers, warnings,
        project: '', norms: '' };
    });
    res.forEach((r, i) => { r.next = r.src.next || (res[i + 1] ? res[i + 1].baseTitle : ''); });
    // п.2 и п.6: заполненное в акте переходит на все следующие акты, пока в каком-то из них не впишут другое
    let lastProj = null, lastNorms = null;
    for (const r of res) {
      if (r.src.project) lastProj = { v: r.src.project, from: r.num }; if (r.src.norms) lastNorms = { v: r.src.norms, from: r.num };
      r.project = r.src.project || (lastProj && lastProj.v) || project.object.projectDoc || '';
      r.norms = r.src.norms || (lastNorms && lastNorms.v) || project.object.norms || '';
      r.projectFrom = r.src.project ? null : lastProj && lastProj.from; r.normsFrom = r.src.norms ? null : lastNorms && lastNorms.from;
    }
    for (const r of res) for (const it of r.items) {
      const tot = it.pos.baseQty, u = used.get(it.posKey) || 0;
      if (u - tot > 1e-6) r.warnings.push(`объём по поз. ${it.pos.n} превышает смету: ${fmtNum(u)} из ${fmtNum(tot)} ${it.pos.baseUnit}`);
    }
    return { acts: res, used };
  }
  function cleanWorkName(n) { return String(n).replace(/\s+/g, ' ').trim(); }

  /* ───────────── Анализ шаблона ───────────── */
  const FIELD_DEFS = [
    ['num', '№ акта'], ['date', 'Дата акта'], ['object', 'Объект'], ['customer', 'Застройщик'], ['builder', 'Лицо, осуществляющее строительство'], ['designer', 'Проектировщик'],
    ['rep1', 'Представитель застройщика (СК) — строка'], ['rep2', 'Представитель подрядчика — строка'], ['rep3', 'Представитель подрядчика (СК) — строка'], ['rep4', 'Представитель проектировщика — строка'], ['rep5', 'Представитель исполнителя — строка'],
    ['performer', 'Работы выполнены (организация)'], ['works', '1. Наименование скрытых работ'], ['project', '2. Проектная документация'], ['materials', '3. Материалы'], ['docs', '4. Предъявленные документы'],
    ['start', 'Дата начала'], ['end', 'Дата окончания'], ['norms', '6. Нормативы'], ['next', '7. Последующие работы'], ['apps', 'Приложения'],
    ['sign1', 'Подпись: застройщик (СК)'], ['sign2', 'Подпись: подрядчик'], ['sign3', 'Подпись: подрядчик (СК)'], ['sign4', 'Подпись: проектировщик'], ['sign5', 'Подпись: исполнитель'],
  ];
  const DATA_COL_FIELD = { A: 'num', B: 'date', C: 'works', D: 'next', E: 'materials', F: 'docs', G: 'start', H: 'end', J: 'apps', K: 'project', L: 'norms' };

  function analyzeTemplate(book) {
    const names = book.sheets.map(s => s.name);
    let actSheet = names.find(n => { const c = sheetCells(book, n); return c && [...c.values()].some(x => /освидетельствования скрытых работ/i.test(String(x.v || ''))); }) || names[0];
    const cells = sheetCells(book, actSheet);
    const map = {}; const counts = {};
    const below = addr => { const [c, r] = splitAddr(addr); return 'A' + (r + 1); };
    const ordered = [...cells.entries()].sort((x, y) => splitAddr(x[0])[1] - splitAddr(y[0])[1] || colNum(splitAddr(x[0])[0]) - colNum(splitAddr(y[0])[0]));
    for (const [addr, c] of ordered) {
      if (c.f) { const m = /Данные!\$?([A-Z]+)\$?1\b/.exec(c.f); if (m && DATA_COL_FIELD[m[1]] && !map[DATA_COL_FIELD[m[1]]]) map[DATA_COL_FIELD[m[1]]] = addr; }
      const s = String(c.v || '').replace(/\s+/g, ' ').trim(); if (!s || splitAddr(addr)[0] !== 'A') continue;
      const hit = (key, cond) => { if (cond) { counts[key] = (counts[key] || 0) + 1; return counts[key]; } return 0; };
      let k;
      if (/^Объект капитального строительства/i.test(s) && !map.object) map.object = below(addr);
      else if (/^Застройщик, технический заказчик/i.test(s) && !map.customer) map.customer = below(addr);
      else if (/^Лицо, осуществляющее строительство/i.test(s) && !map.builder) map.builder = below(addr);
      else if (/^Лицо, осуществляющее подготовку проектной/i.test(s) && !map.designer) map.designer = below(addr);
      else if ((k = hit('r1', /^Представитель застройщика/i.test(s)))) map[k === 1 ? 'rep1' : 'sign1'] = map[k === 1 ? 'rep1' : 'sign1'] || below(addr);
      else if ((k = hit('r3', /^Представитель лица, осуществляющего строительство.*строительного контроля/i.test(s)))) map[k === 1 ? 'rep3' : 'sign3'] = map[k === 1 ? 'rep3' : 'sign3'] || below(addr);
      else if ((k = hit('r2', /^Представитель лица, осуществляющего строительство/i.test(s)))) map[k === 1 ? 'rep2' : 'sign2'] = map[k === 1 ? 'rep2' : 'sign2'] || below(addr);
      else if ((k = hit('r4', /^Представитель лица, осуществляющего подготовку проектной/i.test(s)))) map[k === 1 ? 'rep4' : 'sign4'] = map[k === 1 ? 'rep4' : 'sign4'] || below(addr);
      else if ((k = hit('r5', /^Представитель лица, выполнившего/i.test(s)))) map[k === 1 ? 'rep5' : 'sign5'] = map[k === 1 ? 'rep5' : 'sign5'] || below(addr);
      else if (/^произвели осмотр работ/i.test(s) && !map.performer) map.performer = below(addr);
      else if (/^1\. К освидетельствованию/i.test(s) && !map.works) map.works = below(addr);
      else if (/^2\. Работы выполнены по/i.test(s) && !map.project) map.project = below(addr);
      else if (/^3\. При выполнении работ/i.test(s) && !map.materials) map.materials = below(addr);
      else if (/^4\. Предъявлены документы/i.test(s) && !map.docs) map.docs = below(addr);
      else if (/^6\. Работы выполнены в соответствии/i.test(s) && !map.norms) map.norms = below(addr);
      else if (/^7\. Разрешается/i.test(s) && !map.next) map.next = below(addr);
      else if (/^Приложения/i.test(s) && !map.apps) map.apps = below(addr);
    }
    // Номер, дата акта и даты работ по подписям — если в шаблоне нет формул со ссылками на «Данные»
    {
      const shIdx = book.sheets.findIndex(x => x.name === actSheet);
      const xml = book.txt(book.sheets[shIdx].path);

      if (b != null) xf = xf.replace(/borderId="\d+"/, `borderId="${add(T.borders, S.borders.list[+b] || T.borders.list[0])}"`);

  async function newProject() {

  }
  async function duplicateProject(id) {

  async function deleteProject(id) {

  function renderProjects() {

  }
  async function ensureTplBook() {

  }
  function setStatus(msg) {

  }
  function download(name, data, type) {

  /* ── путь в состоянии ── */

  const isWork = p => p.kind === 'work' && !p.excluded; // исключённые из ИД работы не участвуют нигде

  /* ── загрузка файлов ── */
  async function loadTemplate(file) {
    const [f] = file ? [file] : await pickFile('.xlsx'); if (!f) return;

      const u8 = new Uint8Array(await f.arrayBuffer());
      const book = await IDG.openXlsx(u8);
      const an = IDG.analyzeTemplate(book);
      tplBook = book;
      P.template = { name: f.name, b64: IDG.u8ToB64(u8), analysis: an };
      for (const [k, v] of Object.entries(an.defaults)) if (!k.startsWith('_') && !P.object[k]) P.object[k] = v;
      if (!P.orders.length) {
        for (const [role, line] of Object.entries(an.signerHints)) {
          const o = IDG.parseSignerLine(line); if (!o) continue;
          const ex = P.orders.find(x => x.fio === o.fio && x.number === o.number);

  async function loadEstimates(files) {

  // Убирает из справочника материалов всё, что пришло только из сметы estId; возвращает удалённые материалы

  async function classifyXlsx(f) {

    const first = book.sheets.find(s => s.state === 'visible') || book.sheets[0];
    const cells = IDG.sheetCells(book, first.name) || new Map();
    for (const c of cells.values()) if (/СМЕТНЫЙ РАСЧ[ЕЁ]Т|^Наименование работ и затрат|^ЛОКАЛЬНАЯ СМЕТА|^РАСЧ[ЕЁ]Т СТОИМОСТИ|^Код затрат/i.test(String(c.v || '').trim())) return 'estimate';

  async function handleDroppedFiles(files, forced) {

  function setupDragDrop() {

    const label = k => k === 'template' ? 'Отпустите — загрузить как шаблон' : k === 'estimate' ? 'Отпустите — загрузить как смету' : 'Отпустите файлы — программа сама определит смету, шаблон или проект';

  function saveProject() {

  }
  async function generate(onlyIdx, onlyRegistry) {
    if (!P.template) { toast('Сначала загрузите шаблон', 'err'); tab = 'project'; render(); return; }
    if (!P.acts.length) { toast('Нет актов для формирования', 'err'); return; }
    try {
      const book = await ensureTplBook();
      const tpl = Object.assign({}, P.template.analysis);
      const out = await IDG.generateWorkbook(book, tpl, P, { only: onlyIdx, onlyRegistry });
      const nm = `${onlyRegistry ? 'Реестр ИД' : 'ИД'} ${P.name || ''} ${today()}.xlsx`.replace(/\s+/g, ' ');

  /* ── акты ── */
  // main=true — только основные материалы (отдельные позиции сметы: трубы, изделия, оборудование);
  // расходные ресурсы внутри расценок (электроды, вода и т.п.) предлагаются, но не отмечаются
  function matsForPositions(keys, main = true) {

    for (const k of keys) { const p = pi.get(k); if (p && p.linked) p.linked.forEach(x => all.add(x)); }
    return P.materials.filter(m => !m.skip && (!main || m.main) && m.positions.some(k => all.has(k))).map(m => m.key);
  }
  function newAct(posKey) {

    const a = { id: uid(), date: last ? last.date : today(), start: last ? last.end || last.date : today(), end: last ? last.date : today(), items: [], materials: [], volInTitle: true };
    if (posKey) {
      const p = posIndex().get(posKey);
      const rest = Math.max(0, +(p.baseQty - (used.get(posKey) || 0)).toFixed(4));
      a.items.push({ posKey, vol: rest || p.baseQty });

  /* ── рендер ── */
  const TABS = [
    ['project', 'Объект и шаблон'], ['orders', 'Приказы и подписанты'], ['estimate', 'Смета'], ['materials', 'Материалы'], ['acts', 'Акты'], ['summary', 'Сводная'], ['registry', 'Реестр ИД'], ['mapping', 'Поля шаблона'],
  ];
  // защита от повторного входа: замена DOM снимает фокус, а blur/change внутри может снова вызвать render
  let rendering = false, rerenderQueued = false;
  function render() {
    if (rendering) { if (!rerenderQueued) { rerenderQueued = true; setTimeout(() => { rerenderQueued = false; render(); }, 0); } return; }
    rendering = true;
    try { renderNow(); } finally { rendering = false; }
  }
  function renderNow() {

  /* — приказы — */
  function orderRanges() {
    // для каждой роли — последовательность периодов действия
    const res = {};
    for (const r of ROLES) {
      const os = P.orders.filter(o => o.roles.includes(r.id) && !o.disabled && (o.from || o.date)).sort((a, b) => (a.from || a.date) < (b.from || b.date) ? -1 : 1);
      res[r.id] = os.map((o, i) => { const from = o.from || o.date; let to = o.to || null; const nx = os[i + 1]; if (nx && (!to || (nx.from || nx.date) <= to)) { const d = new Date(nx.from || nx.date); d.setDate(d.getDate() - 1); to = d.toISOString().slice(0, 10); } return { o, from, to }; });
    }
    return res;
  }
  function vOrders(acts) {
    const ranges = orderRanges();
    const dates = [...P.orders.map(o => o.from || o.date), ...P.orders.map(o => o.to), ...P.acts.map(a => a.date)].filter(Boolean).sort();
    let min = dates[0], max = dates[dates.length - 1];
    if (min && max) { const a = new Date(min); a.setDate(a.getDate() - 7); min = a.toISOString().slice(0, 10); const b = new Date(max); b.setDate(b.getDate() + 21); max = b.toISOString().slice(0, 10); }
    const span = min ? (new Date(max) - new Date(min)) || 1 : 1;
    const x = d => ((new Date(d) - new Date(min)) / span * 100);
    const actsMarks = P.acts.filter(a => a.date).map((a, i) => `<i class="tick" style="left:${x(a.date)}%" title="Акт ${esc(acts[i] ? acts[i].num : '')} от ${fmtDate(a.date)}"></i>`).join('');
    const months = []; if (min) { const d = new Date(min); d.setDate(1); d.setMonth(d.getMonth() + 1); while (d.toISOString().slice(0, 10) < max) { months.push(d.toISOString().slice(0, 10)); d.setMonth(d.getMonth() + 1); } }
    const timeline = min ? `
      <section class="card">
        <h2>Кто подписывает в какой период</h2>
        <div class="tl">
          <div class="tl-axis">${months.map(m => `<span style="left:${x(m)}%">${new Date(m).toLocaleDateString('ru-RU', { month: 'short', year: '2-digit' })}</span>`).join('')}</div>
          ${ROLES.map(r => `<div class="tl-row"><div class="tl-l">${r.short}</div><div class="tl-track">${months.map(m => `<i class="grid" style="left:${x(m)}%"></i>`).join('')}${actsMarks}
            ${(ranges[r.id] || []).map(g => `<div class="seg" style="left:${x(g.from)}%;width:${Math.max(0.8, x(g.to || max) - x(g.from))}%" title="${esc(g.o.fio)} · ${esc(g.o.docType || 'приказ')} №${esc(g.o.number)} от ${fmtDate(g.o.date)} · с ${fmtDate(g.from)}${g.to ? ' по ' + fmtDate(g.to) : ''}"><span>${esc(g.o.fio)}</span></div>`).join('') || (r.required ? '<div class="seg empty" style="left:0;width:100%"><span>нет приказа</span></div>' : '')}
          </div></div>`).join('')}
        </div>
        <p class="note">Вертикальные отметки — даты актов. Новый приказ на ту же роль автоматически заменяет предыдущий со своей даты «действует с».</p>
      </section>` : '';
    return `
    <header class="ph"><h1>Приказы и подписанты</h1><p>Для каждого акта программа берёт приказ, действующий на дату акта: самый поздний из тех, у кого «действует с» не позже даты акта, а «по» не раньше неё.</p></header>
    ${timeline}
    <div class="row gap"><button class="btn primary" data-act="add-order">+ Добавить приказ</button></div>
    ${P.orders.map((o, i) => vOrderCard(o, i)).join('') || '<p class="empty">Приказов пока нет. Загрузите шаблон — программа возьмёт подписантов из него — или добавьте вручную.</p>'}`;
  }
  function vOrderCard(o, i) {
    const pp = `orders.${i}.`;
    return `<section class="card order ${o.disabled ? 'off' : ''}">
      <div class="order-h">
        <div class="roles">${ROLES.map(r => `<label class="pill ${o.roles.includes(r.id) ? 'on' : ''}"><input type="checkbox" data-role="${i}:${r.id}" ${o.roles.includes(r.id) ? 'checked' : ''}>${r.short}</label>`).join('')}</div>
        <div class="row"><label class="chk sm"><input type="checkbox" data-path="${pp}disabled" ${o.disabled ? 'checked' : ''}> не учитывать</label><button class="btn ghost sm" data-act="del-order" data-i="${i}">Удалить</button></div>
      </div>
      <div class="grid4">
        ${field('Должность', pp + 'position', { cls: 'span2' })}
        ${field('Фамилия И.О.', pp + 'fio')}
        ${field('№ в НРС', pp + 'nrs', { ph: 'С-78-000000' })}
        ${field('Документ', pp + 'docType', { ph: 'приказ' })}
        ${field('№', pp + 'number')}
        ${field('от', pp + 'date', { type: 'date' })}
        ${field('Листов', pp + 'pages', { type: 'number', hint: 'для реестра' })}
        ${field('Действует с', pp + 'from', { type: 'date', hint: 'пусто = дата приказа' })}
        ${field('по', pp + 'to', { type: 'date', hint: 'необязательно' })}
        ${field('Организация, реквизиты (в конце строки)', pp + 'org', { cls: 'span2' })}
      </div>
      <div class="preview"><span>В акте:</span> ${esc(IDG.signerLine(o))}</div>
      ${field('Наименование в реестре ИД', pp + 'regName', { ph: `Копия приказа на ${[o.position, o.fio].filter(Boolean).join(' ')}`, hint: 'пусто = как в подсказке; можно просклонять: «на эксперта … Попова И.Н.»' })}
      <details><summary>Задать строку вручную</summary>${field('Строка представителя целиком (вместо автоматической)', pp + 'lineOverride', { area: true })}</details>
    </section>`;
  }

  /* — смета — */
  /* — стадии ИД и сводная таблица — */
  const STATUSES = [
    { k: 'work', t: 'В работе' }, { k: 'check', t: 'На проверке' }, { k: 'sign', t: 'На подписании' },
    { k: 'fix', t: 'На исправлении' }, { k: 'done', t: 'Подписано' }, { k: 'rej', t: 'Не подписано' }];
  const stOf = a => STATUSES.find(x => x.k === ((a && a.status) || 'work'));
  const statusSelect = (i, a) => `<select class="st-sel st-${stOf(a).k}" data-status-i="${i}" title="Стадия ИД${a.statusDate ? ' · изменена ' + fmtDate(a.statusDate) : ''}">${STATUSES.map(x => `<option value="${x.k}" ${x.k === stOf(a).k ? 'selected' : ''}>${x.t}</option>`).join('')}</select>`;
  let sumFilter = 'all';

  function donut(parts, total, center, sub) {
    const R = 54, C = 2 * Math.PI * R; let off = 0;
    const segs = total ? parts.filter(p => p.n).map(p => { const len = p.n / total * C; const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke-width="18" class="dn-${p.k}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"><title>${p.t}: ${p.n}</title></circle>`; off += len; return el; }).join('') : '';
    return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(center + ' ' + sub)}"><circle r="${R}" cx="70" cy="70" fill="none" stroke-width="18" class="dn-bg"/><g transform="rotate(-90 70 70)">${segs}</g>
      <text x="70" y="68" text-anchor="middle" class="dn-big">${esc(center)}</text><text x="70" y="88" text-anchor="middle" class="dn-sub">${esc(sub)}</text></svg>`;
  }
  // доля закрытия по позициям сметы: каждая работа — равный вес, объём в акте не больше объёма по смете
  function closure(works, byPos) {
    let acts = 0, signed = 0, full = 0, fullSigned = 0;
    for (const p of works) {
      const list = byPos.get(p.key) || []; const tot = p.baseQty || 0;
      const v = list.reduce((s, x) => s + x.vol, 0), vs = list.filter(x => x.st === 'done').reduce((s, x) => s + x.vol, 0);
      const fa = tot ? Math.min(1, v / tot) : (list.length ? 1 : 0), fs = tot ? Math.min(1, vs / tot) : 0;
      acts += fa; signed += fs; if (fa >= 0.9999) full++; if (fs >= 0.9999) fullSigned++;
    }
    const n = works.length || 1;
    return { acts: acts / n, signed: signed / n, full, fullSigned, count: works.length };
  }
  const pct = x => Math.round(x * 100) + '%';
  const pbar = c => `<div class="pbar" title="подписано ${pct(c.signed)} · оформлено актами ${pct(c.acts)}"><i class="pb-done" style="width:${(c.signed * 100).toFixed(1)}%"></i><i class="pb-acts" style="width:${((c.acts - c.signed) * 100).toFixed(1)}%"></i></div>`;

  // данные сводной для выгрузки и печати
  function summaryData(acts) {
    const byPos = new Map();
    acts.forEach((a, i) => (a.items || []).forEach(it => { const v = +it.vol || 0; if (!byPos.has(it.posKey)) byPos.set(it.posKey, []); byPos.get(it.posKey).push({ i, vol: v, st: stOf(a.src).k }); }));
    const allWorks = P.estimates.flatMap(e => e.positions.filter(isWork));
    const tot = closure(allWorks, byPos);
    const stCount = STATUSES.map(x => ({ ...x, n: acts.filter(a => stOf(a.src).k === x.k).length }));
    const noAct = allWorks.filter(p => !(byPos.get(p.key) || []).length).length;
    const ests = P.estimates.map(e => {
      const ws = e.positions.filter(isWork); if (!ws.length) return null;
      return { e, c: closure(ws, byPos), sections: e.sections.map(sec => {
        const sw = ws.filter(p => p.section === sec); if (!sw.length) return null;
        const rows = []; for (const p of sw) {
          const list = byPos.get(p.key) || []; let cum = 0;
          if (!list.length) rows.push({ p, a: null, vol: 0, rest: p.baseQty, note: (P.posNotes || {})[p.key] || '' });
          for (const x of list) { cum += x.vol; rows.push({ p, a: acts[x.i], vol: x.vol, rest: p.baseQty - cum, st: stOf(acts[x.i].src), note: acts[x.i].src.note || '' }); }
        }
        return { sec, c: closure(sw, byPos), rows };
      }).filter(Boolean) };
    }).filter(Boolean);
    return { tot, stCount, noAct, acts: acts.length, ests };
  }

  async function exportSummaryXlsx() {
    const { acts } = computed(); const d = summaryData(acts);
    const r = n => Math.round(n * 1000) / 1000;
    const rows = []; const merges = [];
    const W = 12;
    rows.push([{ v: 'Сводная по исполнительной документации', s: 'title' }]); merges.push(`A1:L1`);
    rows.push([{ v: `Проект: ${P.name || ''} · сформировано ${fmtDate(today())}`, s: 'muted' }]); merges.push(`A2:L2`);
    rows.push([]);
    const kpi = [['Актов всего', d.acts], ...d.stCount.map(x => [x.t, x.n]), ['Объём подписан (по позициям смет)', { v: d.tot.signed, s: 'pct' }], ['Оформлено актами', { v: d.tot.acts, s: 'pct' }],
      ['Работ закрыто актами полностью', `${d.tot.full} из ${d.tot.count}`], ['Работ без акта', d.noAct]];
    for (const [k, v] of kpi) { rows.push([{ v: k, s: 'label' }, null, null, typeof v === 'object' ? v : { v, s: 'kval' }]); merges.push(`A${rows.length}:C${rows.length}`); }
    rows.push([]);
    const head = ['№ п/п', '№ акта', 'Дата акта', 'Наименование акта / работы', 'Поз.', 'Объём всего', 'Ед.', 'Закрыто', 'Осталось закрыть', 'Стадия ИД', 'Дата стадии', 'Примечание'];
    let n = 0;
    for (const E of d.ests) {
      rows.push([{ v: `${E.e.id} — подписано ${Math.round(E.c.signed * 100)}%, в актах ${Math.round(E.c.acts * 100)}%, закрыто работ ${E.c.full} из ${E.c.count}`, s: 'est' }]); merges.push(`A${rows.length}:L${rows.length}`);
      rows.push(head.map(h => ({ v: h, s: 'head' })));
      for (const S of E.sections) {
        if (S.sec) { rows.push([{ v: `${S.sec} — подписано ${Math.round(S.c.signed * 100)}%, в актах ${Math.round(S.c.acts * 100)}%`, s: 'sec' }]); merges.push(`A${rows.length}:L${rows.length}`); }
        for (const x of S.rows) {
          rows.push([{ v: ++n, s: 'num' }, { v: x.a ? x.a.num : '—', s: 'cell' }, { v: x.a ? fmtDate(x.a.src.date) : '', s: 'cell' },
            { v: x.a ? x.a.baseTitle : x.p.name + ' (нет акта)', s: 'cell' }, { v: String(x.p.n), s: 'cell' }, { v: r(x.p.baseQty), s: 'num' }, { v: x.p.baseUnit, s: 'cell' },
            { v: r(x.vol), s: 'num' }, { v: r(Math.abs(x.rest) < 1e-6 ? 0 : x.rest), s: 'num' }, { v: x.a ? x.st.t : 'Нет акта', s: x.a ? 'st_' + x.st.k : 'st_none' },
            { v: x.a && x.a.src.statusDate ? fmtDate(x.a.src.statusDate) : '', s: 'cell' }, { v: x.note, s: 'cell' }]);
        }
      }
      rows.push([]);
    }
    const out = await IDG.buildSimpleXlsx([{ name: 'Сводная', cols: [7, 11, 11, 60, 8, 12, 7, 11, 13, 16, 11, 40], rows, merges, landscape: true }]);
    download(`Сводная ИД ${P.name || ''} ${today()}.xlsx`.replace(/\s+/g, ' '), out, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    toast('Сводная выгружена в Excel');
  }
